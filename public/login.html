<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · PropReach</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f97316'/><path d='M8 25V13l8-6 8 6v12h-5v-7h-6v7z' fill='%23fff'/></svg>">
<style>
:root{color-scheme:light;--bg:#f7e9db;--raise:#fdf5ec;--ink:#2a1e16;--muted:#5c4e43;--field:#8d7866;--accent:#af3b03;--accent-hover:#932f00;--on-accent:#fff7ee}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:var(--bg);color:var(--ink);font:1.0625rem/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(20rem,100%)}
h1{font-size:1.75rem;line-height:1.25;font-weight:650;letter-spacing:-.02em;margin:0 0 1.75rem}
label{display:block;font-size:.9375rem;color:var(--muted);margin-bottom:.875rem}
input{width:100%;min-height:2.75rem;margin-top:.25rem;padding:.625rem .75rem;border:1px solid var(--field);border-radius:.625rem;font:inherit;font-size:1rem;color:var(--ink);background:var(--raise)}
button{width:100%;min-height:2.75rem;padding:.5625rem 1.125rem;border:0;border-radius:.625rem;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;cursor:pointer}
button:hover{background:var(--accent-hover)}button:disabled{opacity:.5;cursor:not-allowed}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#error{margin:.875rem 0 0;min-height:1.5rem;font-size:.9375rem}
</style>
</head>
<body>
<main>
  <h1>PropReach</h1>
  <form id="form">
    <input type="hidden" name="username" value="admin" autocomplete="username">
    <label>Password<input id="password" type="password" required autofocus autocomplete="current-password"></label>
    <button id="submit">Sign in</button>
  </form>
  <div id="error" role="alert"></div>
</main>
<script>
const MESSAGES = { 401: 'That password is not right.', 429: 'Too many attempts. Try again in 15 minutes.' };
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const button = document.getElementById('submit');
  const error = document.getElementById('error');
  button.disabled = true;
  error.textContent = '';
  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'x-propreach-client': 'dashboard' },
      body: JSON.stringify({ password: document.getElementById('password').value }),
    });
    if (res.ok) { location.replace('/'); return; }
    error.textContent = MESSAGES[res.status] ?? 'Could not sign in. Try again.';
  } catch {
    error.textContent = 'Could not reach the server.';
  }
  button.disabled = false;
});
</script>
</body>
</html>
