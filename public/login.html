<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · PropReach</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23ea580c'/><path d='M8 25V13l8-6 8 6v12h-5v-7h-6v7z' fill='%23fff'/></svg>">
<style>
:root{color-scheme:light;--bg:#efeae3;--raise:#faf7f2;--ink:#241c16;--muted:#5e544b;--line:#e2d9ce;--field:#94867a;--orange:#ea580c;--accent:#b23f08;--accent-hover:#963405;--on-accent:#fffaf5}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:var(--bg);color:var(--ink);font:.9375rem/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(23rem,100%);background:var(--raise);border:1px solid var(--line);border-radius:.625rem;box-shadow:0 1px 3px #241c1614;padding:1.75rem}
.tile{display:grid;place-items:center;width:2rem;height:2rem;border-radius:.4375rem;background:var(--orange);color:#fff;margin-bottom:1rem}.tile svg{width:1.125rem;height:1.125rem;fill:currentColor}
h1{font-size:1.25rem;line-height:1.3;font-weight:650;letter-spacing:-.012em;margin:0}
p{margin:.125rem 0 1.25rem;color:var(--muted);font-size:.875rem}
label{display:block;font-size:.875rem;font-weight:500;margin-bottom:.875rem}
input{width:100%;min-height:2.75rem;margin-top:.25rem;padding:.5rem .625rem;border:1px solid var(--field);border-radius:.375rem;font:inherit;font-size:1rem;font-weight:400;color:var(--ink);background:var(--raise)}
button{width:100%;min-height:2.75rem;padding:.5rem .875rem;border:0;border-radius:.375rem;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;cursor:pointer}
button:hover{background:var(--accent-hover)}button:disabled{opacity:.5;cursor:not-allowed}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#error{margin:.75rem 0 0;min-height:1.375rem;font-size:.875rem;font-weight:500}
</style>
</head>
<body>
<main>
  <div class="tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10l7-5.500L19 10v10h-4.500v-6h-5v6z"/></svg></div>
  <h1>Sign in to PropReach</h1>
  <p>Your AI sales dashboard</p>
  <form id="form">
    <input type="hidden" name="username" value="admin" autocomplete="username">
    <label>Password<input id="password" type="password" required autofocus autocomplete="current-password"></label>
    <button id="submit">Sign in</button>
  </form>
  <div id="error" role="alert"></div>
</main>
<script>
const MESSAGES = { 401: 'That password is not right.', 429: 'Too many attempts. Try again in 15 minutes.' };
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const button = document.getElementById('submit');
  const error = document.getElementById('error');
  button.disabled = true;
  error.textContent = '';
  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'x-propreach-client': 'dashboard' },
      body: JSON.stringify({ password: document.getElementById('password').value }),
    });
    if (res.ok) { location.replace('/'); return; }
    error.textContent = MESSAGES[res.status] ?? 'Could not sign in. Try again.';
  } catch {
    error.textContent = 'Could not reach the server.';
  }
  button.disabled = false;
});
</script>
</body>
</html>
