<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PropReach</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23a6461a'/><path d='M8 25V13l8-6 8 6v12h-5v-7h-6v7z' fill='%23fff9f3'/></svg>">
<style>
:root{color-scheme:light dark;
  --bg:#fbf6ef;--raise:#fffdf9;--ink:#2b211b;--muted:#6f6055;--line:#eadfd2;--field:#8f7e71;
  --accent:#a6461a;--accent-hover:#8c3a14;--on-accent:#fff9f3;--accent-soft:#f6e6d8;
  --hot:#b1361a;--warm:#8a5a06;--callback:#7b4a6b;--cold:#566470;--live:#c8860d;--backdrop:#2b211b59}
@media (prefers-color-scheme:dark){:root{
  --bg:#1b1613;--raise:#241d19;--ink:#f3e9de;--muted:#bdae9f;--line:#372d26;--field:#8a7a6d;
  --accent:#eba877;--accent-hover:#f2bb92;--on-accent:#2b1508;--accent-soft:#3a2619;
  --hot:#f59a80;--warm:#e9bd6b;--callback:#dcaecb;--cold:#adbcc6;--live:#e9bd6b;--backdrop:#000a}}
*{box-sizing:border-box}[hidden]{display:none!important}html{font-size:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:1.0625rem/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--accent);text-underline-offset:.2em}a:hover{color:var(--accent-hover)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:.25rem}

/* Top bar */
.top{display:flex;align-items:center;gap:2.5rem;max-width:64rem;margin:0 auto;padding:1.5rem 1.5rem 0}
.mark{font-weight:650;font-size:1.125rem;letter-spacing:-.01em;color:var(--ink);text-decoration:none}.mark:hover{color:var(--ink)}
#links{display:flex;gap:1.75rem}#links a{color:var(--muted);text-decoration:none;font-size:1rem}#links a:hover{color:var(--ink)}
#links a.on{color:var(--ink);font-weight:600}.phone-only{display:none}
.right{margin-left:auto;display:flex;align-items:center;gap:1rem;font-size:.9375rem;color:var(--muted)}

/* Page */
main{max-width:44rem;margin:0 auto;padding:3.5rem 1.5rem 6rem}
.enter{animation:rise .22s ease-out}@keyframes rise{from{opacity:0;transform:translateY(.25rem)}}
h1{font-size:2rem;line-height:1.25;font-weight:650;letter-spacing:-.02em;margin:0}
h2{font-size:.9375rem;line-height:1.4;font-weight:600;color:var(--muted);margin:0 0 .625rem}
p{margin:0}.eyebrow{color:var(--muted);margin-bottom:.5rem}
.head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.75rem}.head h1{font-size:1.75rem}
.meta{color:var(--muted);font-size:.9375rem}.alert{margin-top:1rem;color:var(--muted)}
.block{margin-top:3rem}.empty{color:var(--muted);padding:2.5rem 0}
.foot{margin-top:3rem;color:var(--muted);font-size:.9375rem}

/* What people said is the only text set in serif */
blockquote{margin:0 0 .625rem;font-family:ui-serif,"New York","Iowan Old Style",Georgia,serif;font-size:1.375rem;line-height:1.45;letter-spacing:-.005em}

/* Rows */
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:1rem;border-bottom:1px solid var(--line)}
.rowmain{all:unset;box-sizing:border-box;flex:1;min-width:0;padding:.875rem 0;cursor:pointer}
.rowmain:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:.25rem}.rowmain:hover .title{color:var(--accent)}
.title{display:block;font-weight:600}.rowmain .meta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowlink{all:unset;cursor:pointer;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:.2em}
.rowlink:hover{color:var(--accent)}.rowlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.single{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer}.single:hover .title{color:var(--accent)}
.state{white-space:nowrap;font-size:.9375rem;color:var(--muted)}.state::before{content:"";display:inline-block;width:.4375rem;height:.4375rem;border-radius:50%;background:currentColor;margin-right:.4375rem;vertical-align:.09em}
.state.hot{color:var(--hot)}.state.warm{color:var(--warm)}.state.callback_requested{color:var(--callback)}.state.cold{color:var(--cold)}
.overdue{font-weight:600;color:var(--ink)}

/* Controls */
button{cursor:pointer;border:0;background:none}button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--accent);color:var(--on-accent);font-weight:600;padding:.5625rem 1.125rem;border-radius:.625rem}.primary:hover{background:var(--accent-hover)}
.quiet{color:var(--accent);padding:.375rem .25rem;border-radius:.375rem}.quiet:hover{color:var(--accent-hover);text-decoration:underline;text-underline-offset:.2em}
.dull{color:var(--muted)}
input,select,textarea{width:100%;padding:.625rem .75rem;border:1px solid var(--field);border-radius:.625rem;background:var(--raise)}input[type=checkbox]{width:auto;accent-color:var(--accent)}
label{display:block;font-size:.9375rem;color:var(--muted);margin-bottom:.875rem}label input,label select,label textarea{margin-top:.25rem;color:var(--ink);font-size:1rem}
label.check{display:flex;gap:.625rem;align-items:center;color:var(--ink);font-size:1rem}label.check input{margin:0}
.filters{display:flex;gap:.625rem;margin-bottom:1.25rem}.filters input{flex:1}.filters select{width:auto;flex:0 0 auto}
.split{display:grid;grid-template-columns:1fr 1fr;gap:0 .875rem}.picks{max-height:14rem;overflow:auto;margin-bottom:.875rem}
.spread{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.375rem}

/* Disclosure */
details{margin-top:2.5rem}summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:.9375rem}summary:hover{color:var(--ink)}details[open] summary{margin-bottom:1rem}
.bars{display:grid;gap:.5rem}.barrow{display:grid;grid-template-columns:7rem 1fr 2rem;gap:.75rem;align-items:center;font-size:.9375rem}
.barrow b{font-weight:600;text-align:right}.bar{background:var(--line);border-radius:99px;height:.5rem;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;min-width:2px}

/* Status lines */
.live{display:block;color:var(--ink);text-decoration:none;margin-bottom:2rem;font-size:.9375rem}.live:hover{color:var(--accent)}
.live i{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:var(--live);margin-right:.5rem;animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.35}}
.problem{display:flex;gap:.75rem;align-items:center;justify-content:space-between;background:var(--accent-soft);padding:.625rem .875rem;border-radius:.625rem;margin-bottom:1.5rem}.sheet .problem{margin:1rem 0 0}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.625rem 1.125rem;border-radius:.75rem;z-index:50;max-width:calc(100vw - 2rem);font-size:.9375rem}

/* Sheets and confirmations */
dialog{border:0;padding:0;color:var(--ink);background:var(--bg)}dialog::backdrop{background:var(--backdrop)}
#dlg{margin:0 0 0 auto;width:min(33rem,100vw);height:100dvh;max-height:100dvh;max-width:100vw}#dlg[open]{animation:slide .2s ease-out}@keyframes slide{from{opacity:0;transform:translateX(1.5rem)}}
.sheet{padding:2rem 2rem 3rem}.sheet header{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1.25rem}.sheet h2.title{font-size:1.5rem;line-height:1.3;color:var(--ink);font-weight:650;margin:0}
.facts{display:grid;grid-template-columns:7.5rem 1fr;gap:.25rem 1rem;margin:1.5rem 0}.facts dt{color:var(--muted)}.facts dd{margin:0}
.correct{display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap;margin:1.5rem 0 0}.correct label{margin:0;flex:1 1 11rem}
audio{width:100%;margin:.5rem 0}.transcript{font-size:1rem;margin-top:.75rem}.transcript p{margin-bottom:.625rem}.transcript .who{display:block;font-size:.875rem;color:var(--muted)}
.transcript .u .said{font-family:ui-serif,"New York","Iowan Old Style",Georgia,serif;font-size:1.125rem}.call{margin-top:1.25rem}
#ask{margin:auto;width:min(26rem,calc(100vw - 2rem));border-radius:1rem}#ask h2{outline:0;font-size:1.25rem;color:var(--ink);margin:0 0 .5rem}#ask p{color:var(--muted);margin-bottom:1.5rem}#ask .sheet{padding:1.75rem}
.actions{display:flex;justify-content:flex-end;gap:.75rem}.actions button:first-child{padding:.5625rem .875rem;color:var(--muted)}

@media (prefers-reduced-motion:reduce){.enter,#dlg[open]{animation:none}.live i{animation:none}}

/* In em, so a larger browser font also moves to this layout. */
@media (max-width:47.5em){
  .top{padding:1rem 1.25rem 0;gap:1rem}.mark{display:inline-flex;align-items:center;min-height:2.75rem}.phone-only{display:inline-flex;align-items:center;min-height:2.75rem;text-decoration:none}
  #view a{display:inline-flex;align-items:center;min-height:2.75rem}
  #links{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;background:var(--bg);border-top:1px solid var(--line);padding:.25rem .25rem calc(.25rem + env(safe-area-inset-bottom))}
  #links a{display:flex;align-items:center;justify-content:center;min-height:2.875rem;font-size:.875rem}#links a[href="#projects"]{display:none}
  main{padding:2rem 1.25rem calc(6rem + env(safe-area-inset-bottom))}h1{font-size:1.625rem}blockquote{font-size:1.25rem}.block{margin-top:2.25rem}
  .primary,.quiet,.dull,input,select,summary,#signout{min-height:2.75rem}summary{display:list-item;line-height:2.75rem}.quiet{padding:0 .375rem}
  label.check{min-height:2.75rem}input[type=checkbox]{width:1.25rem;height:1.25rem}.rowmain{min-height:3.25rem}.rowlink{padding:.75rem 0}
  .filters{flex-wrap:wrap}.filters select{flex:1 1 100%}.split{grid-template-columns:1fr}.row{flex-wrap:wrap;gap:0 .75rem}.sheet{padding:1.5rem 1.25rem 3rem}
  .toast{bottom:calc(4.5rem + env(safe-area-inset-bottom))}.right{gap:.5rem}
}
</style>
</head>
<body>
<header class="top">
  <a class="mark" href="#overview">PropReach</a>
  <nav id="links" aria-label="Main"></nav>
  <div class="right"><span id="status"></span><a class="phone-only" href="#projects">Projects</a><button id="signout" class="quiet dull" data-logout hidden>Sign out</button></div>
</header>
<main>
  <a class="live" id="live" href="#calls" hidden></a>
  <div class="problem" id="problem" role="alert" hidden><span></span><button class="quiet" data-dismiss>Dismiss</button></div>
  <div id="view"></div>
</main>
<div id="toasts" role="status"></div>
<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="sheet"><div id="dlgBody"></div><div class="problem" id="dlgProblem" role="alert" hidden><span></span><button class="quiet" data-dismiss>Dismiss</button></div></div>
  <div id="dlgToasts" role="status"></div>
</dialog>
<dialog id="ask" aria-labelledby="askTitle" aria-describedby="askBody">
  <div class="sheet">
    <h2 id="askTitle" tabindex="-1" autofocus></h2>
    <p id="askBody"></p>
    <div class="actions"><button data-ask="no">Cancel</button><button class="primary" id="askYes" data-ask="yes"></button></div>
  </div>
</dialog>
<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const noop = () => {};

const TABS = { overview: 'Home', leads: 'Leads', campaigns: 'Campaigns', calls: 'Calls', appointments: 'Visits', projects: 'Projects' };
const LABEL = {
  new: 'New', hot: 'Hot', warm: 'Warm', cold: 'Cold', not_interested: 'Not interested',
  callback_requested: 'Callback', unreachable: 'Unreachable', unclassified: 'Needs review',
};
const RESULT = {
  scheduled: 'Scheduled', queued: 'Queued', initiated: 'Dialling', ringing: 'Ringing', 'in-progress': 'On call',
  'call-disconnected': 'Wrapping up', completed: 'No conversation', 'no-answer': 'No answer', busy: 'Busy',
  failed: 'Failed', error: 'Failed', canceled: 'Cancelled', stopped: 'Stopped', 'balance-low': 'Out of credit',
};
const CAMPAIGN_STATUS = { draft: 'Draft', running: 'Calling', done: 'Finished', stopped: 'Stopped', interrupted: 'Interrupted' };
const OUTCOME = {
  hot: 'Clear intent.', warm: 'Still comparing.', cold: 'Not ready yet.',
  callback_requested: 'Wants a call back.', not_interested: 'Not interested.',
};
const ACTIVE_WINDOW_MS = 10 * 60 * 1000;

const tabFromHash = () => { const h = location.hash.slice(1); return Object.hasOwn(TABS, h) ? h : 'overview'; };
let tab = tabFromHash();
const state = {
  search: '', filter: '', selected: new Set(), cName: '', cProject: '', calls: [], names: new Map(), projects: [],
  activeLeads: new Set(), seenAppts: null, open: new Set(),
};
let meta = {};

async function get(path) {
  const r = await fetch(path);
  if (r.status === 401) location.replace('/login');
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
async function post(path, body, raw) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'x-propreach-client': 'dashboard' },
    body: raw ? body : JSON.stringify(body ?? {}),
  });
  if (r.status === 401) location.replace('/login');
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(out.error || r.statusText);
  return out;
}

/** Brief good news. Problems use showProblem, which stays until dismissed. */
function toast(msg, ms = 3500) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  $($('#dlg').open ? '#dlgToasts' : '#toasts').append(t);
  setTimeout(() => t.remove(), ms);
}
function showProblem(msg) {
  const box = $($('#dlg').open ? '#dlgProblem' : '#problem');
  box.querySelector('span').textContent = msg;
  box.hidden = false;
}
const act = (fn) => async (...a) => { try { await fn(...a); } catch (e) { showProblem(e.message); } };
/** Runs an action with its button disabled, so a double-click cannot repeat it. */
async function once(button, fn) {
  button.disabled = true;
  try { return await fn(); } finally { button.disabled = false; }
}
/** Confirmation dialog. Neither button is the default, so a stray Return cannot confirm it. */
function ask({ title, body, confirm }) {
  const dlg = $('#ask');
  $('#askTitle').textContent = title; $('#askBody').textContent = body; $('#askYes').textContent = confirm;
  dlg.returnValue = '';
  dlg.showModal();
  return new Promise((resolve) => dlg.addEventListener('close', () => resolve(dlg.returnValue === 'yes'), { once: true }));
}

const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const stateWord = (s, text) => `<span class="state ${esc(s)}">${esc(text ?? LABEL[s] ?? s)}</span>`;
const price = (l) => (l == null ? '' : l >= 100 ? `₹${+(l / 100).toFixed(2)} Cr` : `₹${+l.toFixed(1)} L`);
const hhmm = (t) => {
  const [h, m] = t.split(':').map(Number);
  return `${h % 12 || 12}${m ? `:${String(m).padStart(2, '0')}` : ''} ${h < 12 ? 'AM' : 'PM'}`;
};
const day = (d) => new Date(`${d}T00:00:00`).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
const dur = (s) => (s ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s` : '');
const utc = (s) => new Date(`${s.replace(' ', 'T')}Z`);
const when = (s) => (s ? utc(s).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '');
const nowIST = () => new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Kolkata' }).slice(0, 16);
const need = (l) => [l.pref_bhk && `${l.pref_bhk} BHK`, l.pref_location, l.budget_lakh && price(l.budget_lakh)].filter(Boolean).join(' · ');
const isActive = (c) => !c.ended_at && Date.now() - utc(c.created_at) < ACTIVE_WINDOW_MS;
const resultOf = (c) => (c.connected ? 'Connected' : isActive(c) ? RESULT[c.status] ?? 'On call' : RESULT[c.status] ?? c.status);
const list = (rows) => `<ul class="rows">${rows.join('')}</ul>`;
const openAttr = (key) => (state.open.has(key) ? 'open' : '');

function greeting() {
  const hour = Number(nowIST().slice(11, 13));
  return hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
}

function headline(o) {
  if (!o.leads) return 'Add your leads and Asha will start calling.';
  if (!o.attemptedLeads) return 'Asha is ready to start calling.';
  const reached = `Asha reached ${o.connectedLeads} of ${plural(o.leads, 'lead')}`;
  return o.visitLeads ? `${reached} and booked ${plural(o.visitLeads, 'site visit')}.` : `${reached}. No visits booked yet.`;
}

function storyLine(s) {
  const who = `<button class="rowlink" data-lead="${s.lead_id}">${esc(s.lead)}</button>`;
  const at = s.date ? `${day(s.date)}, ${hhmm(s.time)}` : '';
  if (s.kind === 'visit') return `Asha booked ${who} for ${at}.`;
  if (s.kind === 'callback') return `Asha set up a consultant call with ${who} for ${at}.`;
  if (s.kind === 'optout') return `${who} asked not to be called again.`;
  if (s.kind === 'abusive') return `Asha ended the call with ${who} after abuse. Worth a look.`;
  return `Asha spoke with ${who}. ${OUTCOME[s.status] ?? 'Needs a review.'}`;
}

function numbers(o) {
  const steps = [
    ['Leads', o.leads], ['Called', o.attemptedLeads], ['Reached', o.connectedLeads], ['Interested', o.interested],
    ['Qualified', o.qualified], ['Hot', o.hot], ['Booked a visit', o.visitLeads],
  ];
  const totals = [plural(o.attempted, 'call') + ' attempted', `${o.connected} connected`, plural(o.visits, 'site visit'), plural(o.callbacks, 'human callback')];
  return `<details data-key="numbers" ${openAttr('numbers')}><summary>Numbers</summary>
    <div class="bars">${steps.map(([k, v]) => `<div class="barrow"><span>${k}</span>
      <div class="bar"><i style="width:${o.leads ? (v / o.leads) * 100 : 0}%"></i></div><b>${v}</b></div>`).join('')}</div>
    <p class="meta" style="margin-top:1rem">${totals.join(' · ')}${o.hotBudgetLakh ? `<br>Stated budget of hot leads: ${price(o.hotBudgetLakh)}` : ''}</p>
  </details>`;
}

const views = {
  async overview() {
    const o = meta;
    const [appts, stories] = await Promise.all([get('/api/appointments'), get('/api/activity')]);
    const now = nowIST();
    const scheduled = appts.filter((a) => a.status === 'scheduled');
    const upcoming = scheduled.filter((a) => `${a.date} ${a.time}` >= now);
    const overdue = scheduled.length - upcoming.length;
    const next = upcoming[0];
    const latest = stories[0];
    const alerts = [
      !o.calling && 'Calling is off.',
      overdue && `<a href="#appointments">${plural(overdue, 'appointment')} overdue</a>.`,
    ].filter(Boolean);
    return `<p class="eyebrow">${greeting()}, ${esc(o.company.name)}</p>
      <h1>${esc(headline(o))}</h1>
      ${alerts.length ? `<p class="alert">${alerts.join(' ')}</p>` : ''}
      ${next ? `<section class="block"><h2>Next</h2>
        <button class="single" data-lead="${next.lead_id}"><span class="title">${esc(next.lead)}</span>
          <span class="meta">${esc(next.project ?? 'Human callback')} · ${day(next.date)}, ${hhmm(next.time)}</span></button>
        ${upcoming.length > 1 ? `<p class="meta" style="margin-top:.375rem"><a href="#appointments">${upcoming.length - 1} more</a></p>` : ''}
      </section>` : ''}
      ${latest ? `<section class="block"><h2>Latest conversation</h2>
        ${latest.quote ? `<blockquote>“${esc(latest.quote)}”</blockquote>` : latest.note ? `<blockquote>${esc(latest.note)}</blockquote>` : ''}
        <p class="meta">${storyLine(latest)}</p>
        ${stories.length > 1 ? `<p class="meta" style="margin-top:.375rem"><a href="#calls">All calls</a></p>` : ''}
      </section>` : `<section class="block"><p class="meta">Conversations appear here after Asha's first call. <a href="#leads">Add leads</a> to begin.</p></section>`}
      ${o.leads ? numbers(o) : ''}
      ${o.hasSamples ? '<p class="foot">Includes sample data. <button class="quiet" data-clear>Clear it</button></p>' : ''}`;
  },

  async leads() {
    const all = await get('/api/leads');
    const q = state.search.toLowerCase();
    const haystack = (l) => `${l.name} ${l.phone} ${l.enquiry} ${l.pref_location ?? ''} ${l.interested_project ?? ''}`.toLowerCase();
    const rows = all.filter((l) => (!state.filter || l.status === state.filter) && (!q || haystack(l).includes(q)));
    const canCall = (l) => meta.calling && !l.dial_blocker && !state.activeLeads.has(l.id);
    const row = (l) => `<li class="row">
      <button class="rowmain" data-lead="${l.id}"><span class="title">${esc(l.name)}</span><span class="meta">${esc(need(l) || l.enquiry || l.phone)}</span></button>
      ${stateWord(l.status)}${canCall(l) ? `<button class="quiet" data-call="${l.id}">Call</button>` : ''}</li>`;
    return `<div class="head"><h1>Leads</h1><button class="primary" data-addlead>Add lead</button></div>
      <div class="filters">
        <input id="search" type="search" placeholder="Search" aria-label="Search leads" value="${esc(state.search)}">
        <select id="filter" aria-label="Filter by status"><option value="">Everyone</option>
          ${Object.entries(LABEL).map(([k, v]) => `<option value="${k}" ${state.filter === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
      </div>
      ${rows.length ? list(rows.map(row)) : `<p class="empty">${all.length ? 'No leads match.' : 'No leads yet.'}</p>`}`;
  },

  async campaigns() {
    const rows = await get('/api/campaigns');
    const row = (c) => {
      const figures = [`${c.dialled ?? 0} of ${c.total} called`, `${c.reached ?? 0} reached`, `${c.interested ?? 0} interested`, plural(c.visits ?? 0, 'visit')];
      if (c.skipped) figures.push(`${c.skipped} skipped`);
      return `<li class="row"><div class="rowmain" style="cursor:default"><span class="title">${esc(c.name)}</span>
        <span class="meta" style="white-space:normal">${esc(c.project ?? 'Whole portfolio')}<br>${figures.join(' · ')}</span></div>
        <span class="state">${esc(CAMPAIGN_STATUS[c.status] ?? c.status)}</span>
        ${c.status === 'running' ? `<button class="quiet" data-stop="${c.id}">Stop</button>` : ''}</li>`;
    };
    return `<div class="head"><h1>Campaigns</h1><button class="primary" data-newcampaign>New campaign</button></div>
      ${rows.length ? list(rows.map(row)) : '<p class="empty">No campaigns yet.</p>'}`;
  },

  async calls() {
    const rows = state.calls;
    const row = (c) => `<li class="row"><button class="rowmain" data-callrow="${c.id}"><span class="title">${esc(c.lead ?? 'Unknown')}</span>
      <span class="meta">${esc(c.summary ?? when(c.created_at))}</span></button>${stateWord(c.lead_status && c.connected ? c.lead_status : '', resultOf(c))}</li>`;
    return `<div class="head"><h1>Calls</h1></div>
      ${rows.length ? list(rows.map(row)) : `<p class="empty">Asha hasn't made any calls yet.</p>`}`;
  },

  async appointments() {
    const rows = await get('/api/appointments');
    const now = nowIST();
    const row = (a) => {
      const late = a.status === 'scheduled' && `${a.date} ${a.time}` < now;
      const what = [a.project ?? 'Human callback', `${day(a.date)}, ${hhmm(a.time)}`, a.rep].filter(Boolean).join(' · ');
      return `<li class="row"><button class="rowmain" data-lead="${a.lead_id}"><span class="title">${esc(a.lead)}${late ? ' <span class="overdue">· Overdue</span>' : ''}</span>
        <span class="meta">${esc(what)}</span></button>
        ${a.status === 'scheduled'
          ? `<button class="quiet" data-appt="${a.id}" data-to="completed" data-kind="${a.type}">Done</button><button class="quiet dull" data-appt="${a.id}" data-to="cancelled" data-kind="${a.type}">Call off</button>`
          : `<span class="state">${a.status === 'cancelled' ? 'Called off' : 'Completed'}</span>`}</li>`;
    };
    const open = rows.filter((a) => a.status === 'scheduled');
    const past = rows.filter((a) => a.status !== 'scheduled');
    return `<div class="head"><h1>Visits</h1></div>
      ${open.length ? list(open.map(row)) : '<p class="empty">Nothing booked yet.</p>'}
      ${past.length ? `<details data-key="past" ${openAttr('past')}><summary>Past</summary>${list(past.map(row))}</details>` : ''}`;
  },

  async projects() {
    state.projects = await get('/api/projects');
    const row = (p) => {
      const from = Math.min(...p.configs.map((c) => c.price_lakh));
      const types = [...new Set(p.configs.map((c) => c.bhk))].join(' and ');
      return `<li class="row"><button class="rowmain" data-project="${p.id}"><span class="title">${esc(p.name)}</span>
        <span class="meta">${esc(p.location.split(',')[0])} · ${esc(types)} BHK · from ${price(from)}</span></button></li>`;
    };
    return `<div class="head"><h1>Projects</h1><button class="primary" data-addproject>Add project</button></div>
      ${list(state.projects.map(row))}`;
  },
};

function links() {
  const box = $('#links');
  if (!box.children.length) {
    box.innerHTML = Object.entries(TABS).map(([k, v]) => `<a href="#${k}">${v}</a>`).join('');
  }
  for (const a of box.children) {
    const on = a.hash === `#${tab}`;
    a.classList.toggle('on', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  document.title = `${TABS[tab]} · PropReach`;
}

/** Builds a selector that finds the same control again after the page is rebuilt. */
function focusSelector(el) {
  if (!el || el === document.body) return null;
  if (el.id) return `#${el.id}`;
  const attrs = Object.entries(el.dataset ?? {}).map(([k, v]) => `[data-${k.replace(/[A-Z]/g, (c) => `-${c.toLowerCase()}`)}="${CSS.escape(v)}"]`);
  return attrs.length ? attrs.join('') : null;
}

let renderId = 0;
let lastHtml = '';
async function render() {
  const id = ++renderId;
  const fetched = await get('/api/overview');
  meta = fetched;
  $('#status').textContent = '';
  $('#signout').hidden = !meta.signInRequired;
  const html = await views[tab]();
  if (id !== renderId || html === lastHtml) return;
  const active = document.activeElement;
  const selector = focusSelector(active);
  const caret = active?.selectionStart;
  lastHtml = html;
  $('#view').innerHTML = html;
  const el = selector && $(selector);
  if (el) {
    el.focus({ preventScroll: true });
    if (caret != null) { try { el.setSelectionRange(caret, caret); } catch { /* inputs without a caret */ } }
  }
}
const safeRender = () => render().catch((e) => {
  lastHtml = '';
  $('#view').innerHTML = `<p class="empty">Could not load this page. ${esc(e.message)}</p>`;
});

/** Refreshes what must stay current on every page: the live call line and new bookings. */
async function pollLive() {
  const [calls, appts] = await Promise.all([get('/api/calls'), get('/api/appointments')]);
  state.calls = calls;
  const active = calls.filter(isActive);
  state.activeLeads = new Set(active.map((c) => c.lead_id));
  const live = $('#live');
  live.hidden = !active.length;
  live.innerHTML = active.length ? `<i></i>${active.map((c) => {
    const secs = Math.max(0, Math.floor((Date.now() - utc(c.created_at)) / 1000));
    return `Asha is talking to ${esc(c.lead ?? c.phone ?? 'someone')} · ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
  }).join(' &nbsp;·&nbsp; ')}` : '';

  const scheduled = appts.filter((a) => a.status === 'scheduled');
  if (state.seenAppts) {
    for (const a of scheduled.filter((x) => !state.seenAppts.has(x.id))) {
      const what = a.type === 'visit' ? `Asha booked ${a.lead} for ${a.project}` : `Asha set up a callback with ${a.lead}`;
      toast(`${what}, ${day(a.date)}, ${hhmm(a.time)}`, 8000);
    }
  }
  state.seenAppts = new Set(appts.map((a) => a.id));
}

async function poll() {
  if (document.hidden) return;
  try {
    await pollLive();
    // Rebuilding would close an open dropdown or disturb a sheet.
    if (!$('#dlg').open && !$('#ask').open && document.activeElement?.tagName !== 'SELECT') await render();
  } catch {
    $('#status').textContent = 'Reconnecting…';
  }
}

function openDlg(html) {
  $('#dlgBody').innerHTML = html;
  $('#dlgBody h2').id = 'dlgTitle';
  $('#dlgProblem').hidden = true;
  if (!$('#dlg').open) $('#dlg').showModal();
  $('#dlgBody form input:not([type=hidden])')?.focus();
}
const closeBtn = '<button class="quiet dull" data-close>Close</button>';
const facts = (pairs) => {
  const shown = pairs.filter(([, v]) => v);
  return shown.length ? `<dl class="facts">${shown.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : '';
};

function transcriptHtml(text) {
  if (!text) return '<p class="meta">No transcript for this call.</p>';
  return `<div class="transcript">${text.split('\n').filter(Boolean).map((line) => {
    const m = line.match(/^(assistant|user):\s*(.*)$/i);
    if (!m) return `<p class="meta">${esc(line)}</p>`;
    const user = m[1].toLowerCase() === 'user';
    return `<p class="${user ? 'u' : ''}"><span class="who">${user ? 'Customer' : 'Asha (AI)'}</span><span class="said">${esc(m[2])}</span></p>`;
  }).join('')}</div>`;
}

function recordingHtml(call) {
  if (!call.has_recording) return '';
  return `<audio controls preload="none" src="/api/calls/${Number(call.id)}/recording"></audio>`;
}

async function showLead(id) {
  const l = await get(`/api/leads/${id}`);
  const decidedBy = ['new', 'unreachable'].includes(l.status) ? '' : l.status_by === 'team' ? 'Set by your team' : 'Set by Asha (AI)';
  const canCall = meta.calling && !l.do_not_call && l.consent && !l.is_sample && !state.activeLeads.has(l.id);
  const why = l.is_sample ? 'Sample leads are never called.' : l.do_not_call ? 'On the do-not-call list.' : !l.consent ? 'No consent on record, so Asha will not call.' : '';
  const appt = (a) => `<p class="meta">${a.type === 'visit' ? `${esc(a.project)} visit` : 'Callback'}, ${day(a.date)} ${hhmm(a.time)}, ${esc(a.rep ?? 'Unassigned')} (${esc(a.status)})</p>`;
  const call = (c) => `<div class="call"><p class="meta">${when(c.created_at)} · ${esc([resultOf(c), dur(c.duration)].filter(Boolean).join(' · '))}</p>
    ${recordingHtml(c)}${c.transcript ? transcriptHtml(c.transcript) : ''}</div>`;
  openDlg(`<header><div><h2 class="title">${esc(l.name)}</h2><span class="meta">${esc(l.phone)}</span></div>${closeBtn}</header>
    ${canCall ? `<button class="primary" data-call="${l.id}">Call</button>` : why ? `<p class="meta">${why}</p>` : ''}
    ${l.summary ? `<p style="margin-top:1.25rem">${esc(l.summary)}</p><p class="meta">AI summary</p>` : ''}
    ${facts([['Looking for', need(l)], ['Purpose', l.purpose], ['Timeline', l.timeline], ['Project', l.interested_project], ['Next step', l.next_action], ['Enquiry', l.enquiry]])}
    <div class="correct">
      <label>Lead status<select id="leadStatus" data-id="${l.id}">${Object.entries(LABEL).map(([k, v]) => `<option value="${k}" ${k === l.status ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <button class="quiet dull" data-dnc="${l.id}" data-value="${l.do_not_call ? 0 : 1}">${l.do_not_call ? 'Allow calls again' : 'Mark do not call'}</button>
    </div>
    ${decidedBy ? `<p class="meta" style="margin-top:.375rem">${decidedBy}</p>` : ''}
    ${l.appointments.length ? `<details data-key="lead-appts"><summary>Appointments</summary>${l.appointments.map(appt).join('')}</details>` : ''}
    ${l.calls.length ? `<details data-key="lead-calls"><summary>Calls</summary>${l.calls.map(call).join('')}</details>` : ''}`);
}

function showCall(id) {
  const c = state.calls.find((x) => x.id === id);
  if (!c) return;
  openDlg(`<header><div><h2 class="title">${esc(c.lead ?? 'Unknown')}</h2><span class="meta">${when(c.created_at)}</span></div>${closeBtn}</header>
    ${c.summary ? `<p>${esc(c.summary)}</p><p class="meta">AI summary</p>` : ''}
    ${facts([['Result', resultOf(c)], ['Lead status', LABEL[c.lead_status] ?? c.lead_status], ['Duration', dur(c.duration)], ['Campaign', c.campaign ?? 'Direct'], ['Project', c.project]])}
    ${recordingHtml(c)}${transcriptHtml(c.transcript)}`);
}

function showProject(id) {
  const p = state.projects.find((x) => x.id === id);
  if (!p) return;
  openDlg(`<header><div><h2 class="title">${esc(p.name)}</h2><span class="meta">${esc(p.location)}</span></div>${closeBtn}</header>
    ${p.description ? `<p>${esc(p.description)}</p>` : ''}
    ${facts([...p.configs.map((c) => [`${c.bhk} BHK`, `${c.size_sqft} sq ft, from ${price(c.price_lakh)}, ${c.units_left} left`]),
      ['Possession', p.possession], ['Payment plan', p.payment_plan], ['Amenities', p.amenities.join(', ')], ['Nearby', p.landmarks.join(', ')]])}`);
}

async function openCampaign() {
  const [leads, projects] = await Promise.all([get('/api/leads'), get('/api/projects')]);
  const ready = leads.filter((l) => !l.dial_blocker);
  state.names = new Map(ready.map((l) => [l.id, l.name]));
  const picked = ready.filter((l) => state.selected.has(l.id)).length;
  openDlg(`<header><h2 class="title">New campaign</h2>${closeBtn}</header>
    <label>Name<input id="cName" placeholder="Whitefield Heights launch" value="${esc(state.cName)}"></label>
    <label>Focus project<select id="cProject"><option value="">Whole portfolio</option>
      ${projects.map((p) => `<option value="${p.id}" ${String(p.id) === state.cProject ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
    ${ready.length ? `<div class="spread"><span class="meta" id="pickCount">${picked} of ${ready.length} selected</span><button class="quiet" data-pickall>Select all</button></div>
      <div class="picks">${ready.map((l) => `<label class="check"><input type="checkbox" data-pick="${l.id}" ${state.selected.has(l.id) ? 'checked' : ''}>${esc(l.name)}</label>`).join('')}</div>`
      : '<p class="meta" style="margin-bottom:1rem">Add a real lead with consent first. Sample leads are never called.</p>'}
    <button class="primary" data-launch ${meta.calling && picked ? '' : 'disabled'}>Start campaign</button>
    ${meta.calling ? '' : '<p class="meta" style="margin-top:.5rem">Calling is off.</p>'}`);
}

function syncPicks() {
  const boxes = [...document.querySelectorAll('[data-pick]')];
  const n = boxes.filter((b) => b.checked).length;
  $('#pickCount').textContent = `${n} of ${boxes.length} selected`;
  $('[data-launch]').disabled = !meta.calling || !n;
}

const FORMS = {
  lead: `<header><h2 class="title">Add lead</h2>${closeBtn}</header>
    <form data-form="lead">
      <label>Name<input name="name" required autocomplete="off"></label>
      <label>Phone<input name="phone" type="tel" required placeholder="+91 98xxxxxxxx" inputmode="tel" autocomplete="off"></label>
      <label>Looking for<input name="enquiry" placeholder="3 BHK in Whitefield"></label>
      <label class="check"><input type="checkbox" name="consent" required>This person agreed to be contacted</label>
      <p style="margin-top:1rem"><button class="primary">Save lead</button></p>
    </form>
    <p class="meta" style="margin-top:1.5rem">Have a list? <button class="quiet" data-upload>Upload a CSV</button></p>`,
  csv: `<header><h2 class="title">Upload leads</h2>${closeBtn}</header>
    <p class="meta" style="margin-bottom:1rem">Columns: name, phone, enquiry, source, consent. Set consent to yes only where you hold it. Anyone else is saved but not called.</p>
    <form data-form="csv">
      <label>CSV file<input type="file" name="file" accept=".csv,text/csv" required></label>
      <button class="primary">Upload leads</button>
    </form>`,
  project: `<header><h2 class="title">Add project</h2>${closeBtn}</header>
    <form data-form="project">
      <label>Name<input name="name" required></label>
      <label>Location<input name="location" required placeholder="Hebbal, Bengaluru"></label>
      <label>Areas buyers may mention<input name="areas" placeholder="hebbal, manyata"></label>
      <div class="split">
        <label>BHK<input name="bhk" type="number" min="1" max="9" required></label>
        <label>Size, sq ft<input name="size_sqft" type="number" min="1" required></label>
        <label>Starting price, lakh<input name="price_lakh" type="number" min="1" step="0.1" required></label>
        <label>Units left<input name="units_left" type="number" min="0" required></label>
      </div>
      <details data-key="project-more"><summary>More details</summary>
        <label>Description<textarea name="description" rows="2"></textarea></label>
        <label>Amenities, comma separated<input name="amenities"></label>
        <label>Possession<input name="possession"></label>
        <label>Nearby landmarks, comma separated<input name="landmarks"></label>
        <label>Payment plan<input name="payment_plan"></label>
      </details>
      <p style="margin-top:1.25rem"><button class="primary">Save project</button></p>
    </form>`,
};

function launchSummary(ids, project) {
  const names = ids.map((id) => state.names.get(id)).filter(Boolean);
  const shown = names.slice(0, 3).join(', ');
  const others = names.length > 3 ? ` and ${plural(names.length - 3, 'other')}` : '';
  return `Asha starts calling ${shown}${others} straight away${project ? `, leading with ${project}` : ''}. You can stop the campaign, but calls already ringing will finish.`;
}

document.addEventListener('click', act(async (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  const d = t.dataset;
  if (d.ask) return $('#ask').close(d.ask);
  if ('close' in d) return $('#dlg').close();
  if ('dismiss' in d) { t.parentElement.hidden = true; return; }
  if ('logout' in d) { await post('/logout'); location.replace('/login'); return; }
  if ('clear' in d) {
    const yes = await ask({ title: 'Clear sample data?', body: "This deletes the sample leads, calls and appointments. It can't be undone.", confirm: 'Clear data' });
    if (!yes) return;
    await post('/api/samples/clear');
    toast('Sample data cleared');
    return safeRender();
  }
  if (d.call) {
    await once(t, () => post(`/api/leads/${d.call}/call`));
    toast('Asha is calling now.');
    if ($('#dlg').open) $('#dlg').close();
    await pollLive().catch(noop);
    return safeRender();
  }
  if ('addlead' in d) return openDlg(FORMS.lead);
  if ('upload' in d) return openDlg(FORMS.csv);
  if ('addproject' in d) return openDlg(FORMS.project);
  if ('newcampaign' in d) return openCampaign();
  if (d.appt) {
    if (d.to === 'cancelled') {
      const noun = d.kind === 'visit' ? 'visit' : 'callback';
      const yes = await ask({ title: `Call off this ${noun}?`, body: "The buyer isn't told automatically, so let them know.", confirm: `Call off ${noun}` });
      if (!yes) return;
    }
    await once(t, () => post(`/api/appointments/${d.appt}`, { status: d.to }));
    return safeRender();
  }
  if ('pickall' in d) {
    document.querySelectorAll('[data-pick]').forEach((box) => { box.checked = true; state.selected.add(Number(box.dataset.pick)); });
    return syncPicks();
  }
  if ('launch' in d) {
    const lead_ids = [...state.selected].filter((id) => $(`[data-pick="${id}"]`));
    const project = state.cProject ? $('#cProject').selectedOptions[0]?.textContent : '';
    const yes = await ask({
      title: `Call ${lead_ids.length === 1 ? '1 person' : `${lead_ids.length} people`} now?`,
      body: launchSummary(lead_ids, project), confirm: 'Start calling',
    });
    if (!yes) return;
    await once(t, () => post('/api/campaigns', { name: state.cName, project_id: Number(state.cProject) || null, lead_ids }));
    state.selected.clear(); state.cName = ''; state.cProject = '';
    $('#dlg').close();
    toast('Campaign started');
    return;
  }
  if (d.stop) {
    const yes = await ask({ title: 'Stop this campaign?', body: 'No new calls will start, and queued calls are cancelled. Calls already ringing or connected will finish.', confirm: 'Stop campaign' });
    if (!yes) return;
    await once(t, () => post(`/api/campaigns/${d.stop}/stop`));
    toast('Campaign stopped');
    return safeRender();
  }
  if (d.dnc) {
    const on = d.value === '1';
    const yes = await ask(on
      ? { title: 'Mark as do not call?', body: "Asha won't call this person again, and their booked visits and callbacks are called off.", confirm: 'Mark do not call' }
      : { title: 'Allow calls again?', body: 'Only do this if this person asked to be contacted again.', confirm: 'Allow calls' });
    if (!yes) return;
    await post(`/api/leads/${d.dnc}`, { do_not_call: on });
    return showLead(d.dnc);
  }
  if (d.lead) return showLead(d.lead);
  if (d.callrow) return showCall(Number(d.callrow));
  if (d.project) return showProject(Number(d.project));
}));

document.addEventListener('change', act(async (e) => {
  const { id, dataset, value, checked } = e.target;
  if (dataset.pick) {
    const lead = Number(dataset.pick);
    if (checked) state.selected.add(lead); else state.selected.delete(lead);
    syncPicks();
  }
  if (id === 'filter') { state.filter = value; safeRender(); }
  if (id === 'cProject') state.cProject = value;
  if (id === 'leadStatus') {
    await post(`/api/leads/${dataset.id}`, { status: value });
    toast('Lead status updated');
    await showLead(dataset.id);
  }
}));
document.addEventListener('input', (e) => {
  if (e.target.id === 'search') { state.search = e.target.value; safeRender(); }
  if (e.target.id === 'cName') state.cName = e.target.value;
});
// toggle does not bubble, so listen on the way down. Remembered so a refresh keeps a section open.
document.addEventListener('toggle', (e) => {
  const key = e.target.dataset?.key;
  if (!key) return;
  if (e.target.open) state.open.add(key); else state.open.delete(key);
}, true);

document.addEventListener('submit', act(async (e) => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  $('#dlgProblem').hidden = true;
  const f = Object.fromEntries(new FormData(form));
  await once(form.querySelector('button.primary'), async () => {
    if (form.dataset.form === 'lead') {
      await post('/api/leads', { ...f, consent: f.consent ? 'yes' : '', source: 'Manual' });
      toast('Lead added');
    }
    if (form.dataset.form === 'csv') {
      const r = await post('/api/leads/csv', await f.file.text(), true);
      if (!r.added && r.errors.length) throw new Error(`Nothing added. First problem: ${r.errors[0]}`);
      const notes = [r.errors.length && `${r.errors.length} skipped`, r.noConsent && `${r.noConsent} without consent will not be called`];
      toast(`Added ${r.added}. ${notes.filter(Boolean).join('. ')}`.trim(), 6000);
    }
    if (form.dataset.form === 'project') {
      const { bhk, size_sqft, price_lakh, units_left, ...rest } = f;
      await post('/api/projects', { ...rest, configs: [{ bhk, size_sqft, price_lakh, units_left }] });
      toast('Project saved. Asha can use it now.');
    }
  });
  $('#dlg').close();
}));

$('#dlg').addEventListener('close', () => { safeRender(); });
addEventListener('hashchange', () => {
  tab = tabFromHash();
  links();
  scrollTo(0, 0);
  const view = $('#view');
  view.classList.remove('enter');
  void view.offsetWidth;
  view.classList.add('enter');
  safeRender();
});
setInterval(poll, 4000);
links();
pollLive().catch(noop).finally(safeRender);
</script>
</body>
</html>
