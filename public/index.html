<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PropReach AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23185c4e'/><path d='M8 25V13l8-6 8 6v12h-5v-7h-6v7z' fill='%23fff'/></svg>">
<style>
:root{color-scheme:light dark;--bg:#f6f5f1;--panel:#fff;--hover:#faf9f5;--ink:#1c2321;--muted:#5f6965;--line:#e4e2db;--field:#8c8a82;
--brand:#185c4e;--on-brand:#fff;--brand-hover:#134b40;--brand-soft:#e2efe9;--badge:#4b5350;--grey-soft:#ececea;
--hot:#b5381f;--hot-soft:#fbe7e1;--warm:#8f5b00;--warm-soft:#faeed4;--warm-line:#efdcae;--cold:#3a6188;--cold-soft:#e3edf6;
--violet:#5d4a9c;--violet-soft:#ebe7f6;--pending:#b87a10;--backdrop:#0006}
@media (prefers-color-scheme:dark){:root{--bg:#131715;--panel:#1b201e;--hover:#222826;--ink:#e9edea;--muted:#a9b3ae;--line:#2f3633;--field:#7c8782;
--brand:#62c9a7;--on-brand:#0c241d;--brand-hover:#7ad6b7;--brand-soft:#173a30;--badge:#c8cfcb;--grey-soft:#2c3330;
--hot:#ffa48d;--hot-soft:#4a241b;--warm:#efc06e;--warm-soft:#3d2f15;--warm-line:#5a4520;--cold:#a3c8ee;--cold-soft:#1e3245;
--violet:#c8bbf4;--violet-soft:#2f284b;--pending:#efc06e;--backdrop:#000a}}
*{box-sizing:border-box}[hidden]{display:none!important}html{font-size:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:.9375rem/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:13.5rem minmax(0,1fr);min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:1.25rem .75rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{font-weight:700;font-size:1.125rem;padding:0 .75rem 1.25rem;letter-spacing:-.01em;color:var(--ink)}.logo span{color:var(--muted);font-weight:500}
#links{display:contents}#links a{display:block;padding:.5625rem .75rem;border-radius:.5rem;color:var(--ink);text-decoration:none;margin-bottom:2px}
#links a:hover{background:var(--hover)}#links a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
#links .short,.phone-only{display:none}
.status{margin-top:auto;font-size:.8125rem;padding:.75rem;color:var(--muted);white-space:nowrap}
.dot{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;margin-right:.375rem;background:var(--pending)}.dot.on{background:var(--brand)}
#signout{background:none;border:1px solid var(--field);padding:.1875rem .5625rem;font-size:.75rem;margin-top:.5rem}
main{padding:1.75rem 2rem 3.75rem;max-width:77.5rem;width:100%}
h1{font-size:1.5rem;line-height:1.25;margin:0 0 .25rem;letter-spacing:-.02em}h2{font-size:1rem;margin:0 0 .75rem}
.sub{color:var(--muted);margin:0 0 1.375rem}.eyebrow{color:var(--muted);font-size:.8125rem;margin:0 0 .125rem}
.live{display:block;background:var(--brand);color:var(--on-brand);text-decoration:none;padding:.625rem .875rem;border-radius:.625rem;margin-bottom:1.125rem;font-weight:600}
.live:hover{background:var(--brand-hover)}.live i{display:inline-block;width:.5625rem;height:.5625rem;border-radius:50%;background:var(--on-brand);margin-right:.5625rem;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.notice,.problem{background:var(--warm-soft);border:1px solid var(--warm-line);padding:.625rem .875rem;border-radius:.625rem;margin-bottom:1.125rem;display:flex;gap:.75rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.problem{background:var(--panel);border:1px solid var(--ink);font-weight:600}.dlg .problem{margin:.75rem 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:.75rem;padding:1.125rem;margin-bottom:1.125rem}
.home{display:flex;flex-wrap:wrap;gap:0 2rem;margin-top:1.375rem;align-items:flex-start}.feed{flex:1.6 1 26rem;min-width:0}.side{flex:1 1 20rem;min-width:0}
.feed h2{font-size:.8125rem;color:var(--muted);font-weight:600;margin:0 0 .25rem}
.story{padding:1.125rem 0;border-top:1px solid var(--line)}.story .spread{flex-wrap:nowrap;padding:0}.story .spread h3{flex:1;min-width:0}.story h3{font-size:1.0625rem;line-height:1.35;font-weight:600;margin:0}
.story blockquote{margin:.5rem 0 0;font-size:1.0625rem;line-height:1.45}.story .note{margin:.5rem 0 0;color:var(--muted)}
.story .facts{margin:.5rem 0 0;font-size:.8125rem;color:var(--muted)}.story time{white-space:nowrap}
.funnel .row{display:grid;grid-template-columns:6.5rem 1fr 1.75rem 2.625rem;gap:.625rem;align-items:center;margin:.5rem 0;font-size:.875rem}
.funnel .pct{color:var(--muted);font-size:.8125rem;text-align:right}.funnel p{margin:.875rem 0 0}
.bar{background:var(--grey-soft);border-radius:.3125rem;height:.875rem;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:.3125rem;min-width:2px}
.spread{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 .75rem;padding:.3125rem 0}
.next{display:flex;justify-content:space-between;gap:.75rem;padding:.3125rem 0}.next b,.next .small{display:block}.next .when{text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto;margin:-.25rem -1.125rem -1.125rem}table{width:100%;border-collapse:collapse;min-width:40rem}
th{text-align:left;font-size:.75rem;color:var(--muted);font-weight:600;padding:.5625rem .875rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.6875rem .875rem;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--hover)}tr.fresh td{background:var(--brand-soft)}
.small{font-size:.8125rem;color:var(--muted)}.nowrap{white-space:nowrap}.clip{max-width:20rem}.reason::first-letter{text-transform:uppercase}
.badge{display:inline-block;padding:2px .5625rem;border-radius:99px;font-size:.75rem;font-weight:600;white-space:nowrap;background:var(--grey-soft);color:var(--badge)}
.hot{background:var(--hot-soft);color:var(--hot)}.warm{background:var(--warm-soft);color:var(--warm)}.cold{background:var(--cold-soft);color:var(--cold)}
.callback_requested{background:var(--violet-soft);color:var(--violet)}.good{background:var(--brand-soft);color:var(--brand)}.overdue{background:var(--ink);color:var(--bg)}
button{background:var(--panel);border:1px solid var(--field);padding:.4375rem .8125rem;border-radius:.5rem;cursor:pointer}button:hover{border-color:var(--ink)}
button.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}button.primary:hover{background:var(--brand-hover)}button:disabled{opacity:.5;cursor:not-allowed}
.rowlink{all:unset;font-weight:600;cursor:pointer}.rowlink:hover{text-decoration:underline}.rowlink:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input,select,textarea{width:100%;padding:.5rem .625rem;border:1px solid var(--field);border-radius:.5rem;background:var(--panel)}input[type=checkbox]{width:auto;margin:0}
label{display:block;font-size:.8125rem;color:var(--muted);margin-bottom:.625rem}label input,label select,label textarea{margin-top:3px;color:var(--ink)}
label.check{display:flex;gap:.5rem;align-items:center;color:inherit;margin:.25rem 0;font-size:.9375rem}label.check input{margin:0}
.toolbar{display:flex;gap:.625rem;margin-bottom:.875rem;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select{width:auto;flex:0 1 15rem}.spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 .875rem}.picks{max-height:10.625rem;overflow:auto;margin-bottom:.75rem}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(18.75rem,100%),1fr));gap:.875rem}.projects .card{margin:0}
.chips span{display:inline-block;background:var(--grey-soft);border-radius:.375rem;padding:1px .5rem;font-size:.75rem;margin:0 .25rem .25rem 0}
.units{width:100%;min-width:0;margin:.5rem 0}.units td,.units th{padding:.3125rem 0;border:0}
dialog{border:0;border-radius:.875rem;padding:0;width:min(45rem,calc(100vw - 2rem));max-height:calc(100vh - 3rem);color:var(--ink);background:var(--panel)}dialog::backdrop{background:var(--backdrop)}
#ask{width:min(26.25rem,calc(100vw - 2rem))}#ask h2{outline:0;font-size:1.0625rem;margin:0 0 .375rem}#ask p{margin:0 0 1.125rem;color:var(--muted)}
.actions{display:flex;justify-content:flex-end;gap:.625rem}
.dlg{padding:1.375rem}.dlg header{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;margin-bottom:.625rem}.dlg h2.title{font-size:1.25rem;margin:0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.375rem,1fr));gap:.625rem;margin:.875rem 0}.kv div span{display:block;font-size:.75rem;color:var(--muted)}
.correct{display:flex;gap:.75rem;align-items:flex-end;flex-wrap:wrap;margin:.875rem 0}.correct label{margin:0;flex:0 1 13rem}
audio{width:100%;margin:.375rem 0 .75rem}
.transcript{background:var(--bg);padding:.75rem;border-radius:.5625rem;max-height:18.75rem;overflow:auto;font-size:.875rem}.transcript p{margin:0 0 .5rem}
.transcript b{color:var(--brand)}.transcript .u b{color:var(--ink)}
.toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5625rem 1rem;border-radius:.5625rem;z-index:50;max-width:calc(100vw - 2rem)}
.empty{color:var(--muted);text-align:center;padding:1.875rem .625rem}
/* In em, so a larger browser font also moves to this layout. */
@media (max-width:47.5em){
  html{font-size:106.25%}body{font-size:1rem}
  .app{display:block}main{padding:1.125rem 1rem calc(5.5rem + env(safe-area-inset-bottom))}
  nav{position:static;height:auto;padding:.75rem 1rem;flex-direction:row;align-items:center;gap:.75rem;border-right:0;border-bottom:1px solid var(--line)}
  .logo{padding:0;white-space:nowrap}.status{margin:0 0 0 auto;padding:0;display:flex;align-items:center;gap:.75rem}.status>#status{display:none}
  .phone-only{display:inline-flex}.status a,#signout{display:inline-flex;align-items:center;min-height:2.75rem;margin:0;padding:0 .625rem;font-size:.875rem}.status a{text-decoration:none}
  #links{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--panel);border-top:1px solid var(--line);padding:.25rem .25rem calc(.25rem + env(safe-area-inset-bottom))}
  #links a{display:flex;align-items:center;justify-content:center;min-height:2.75rem;margin:0;padding:0 .125rem;font-size:.75rem;text-align:center}
  #links a[href="#projects"],#links .full{display:none}#links .short{display:inline}
  button,input,select{min-height:2.75rem}input,select,textarea{font-size:1rem}.grid2{grid-template-columns:1fr}
  .toolbar input,.toolbar select{flex:1 1 100%}.toolbar .spacer{display:none}.toolbar button{flex:1}
  .rowlink{display:inline-flex;align-items:center;min-height:2.75rem}label.check{min-height:2.75rem;font-size:1rem}input[type=checkbox]{width:1.25rem;height:1.25rem;min-height:0}
  .home{flex-direction:column;flex-wrap:nowrap;align-items:stretch}.feed,.side{flex:none}.side{display:contents}.upnext{order:-1}.feed{margin-bottom:1.125rem}.funnel .row{grid-template-columns:5.5rem 1fr 1.5rem 2.375rem}
  .toast{bottom:calc(4.5rem + env(safe-area-inset-bottom))}
  .tablewrap{overflow:visible}table.cards,table.cards tbody{display:block;min-width:0}table.cards thead{display:none}
  table.cards tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.125rem .75rem;padding:.625rem 1.125rem;border-bottom:1px solid var(--line)}
  table.cards tr:last-child{border-bottom:0}table.cards td{display:block;padding:0;border:0;grid-column:1/-1;max-width:none}
  table.cards td.lead{grid-column:1;grid-row:1}table.cards td.tag{grid-column:2;grid-row:1;text-align:right;align-self:center}table.cards td.blank{display:none}
  table.cards td[data-label]::before{content:attr(data-label) ": ";color:var(--muted)}table.cards td.action{margin-top:.5rem;display:flex;gap:.625rem;flex-wrap:wrap}table.cards td.action button{flex:1}
  .story .spread{display:block}
}
</style>
</head>
<body>
<div class="app">
  <nav aria-label="Main">
    <div class="logo">PropReach <span>AI</span></div>
    <div id="links"></div>
    <div class="status"><div id="status"></div><a class="phone-only" href="#projects">Projects</a><button id="signout" data-logout hidden>Sign out</button></div>
  </nav>
  <main>
    <a class="live" id="live" href="#calls" hidden></a>
    <div class="problem" id="problem" role="alert" hidden><span></span><button data-dismiss>Dismiss</button></div>
    <div id="view"></div>
  </main>
</div>
<div id="toasts" role="status"></div>
<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg"><div id="dlgBody"></div><div class="problem" id="dlgProblem" role="alert" hidden><span></span><button data-dismiss>Dismiss</button></div></div>
  <div id="dlgToasts" role="status"></div>
</dialog>
<dialog id="ask" aria-labelledby="askTitle" aria-describedby="askBody">
  <div class="dlg">
    <h2 id="askTitle" tabindex="-1" autofocus></h2>
    <p id="askBody"></p>
    <div class="actions"><button data-ask="no">Cancel</button><button class="primary" id="askYes" data-ask="yes"></button></div>
  </div>
</dialog>
<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const noop = () => {};

const TABS = { overview: 'Overview', leads: 'Leads', campaigns: 'Campaigns', calls: 'Call history', appointments: 'Appointments', projects: 'Projects' };
const SHORT_TABS = { calls: 'Calls', appointments: 'Visits' };
const LABEL = {
  new: 'New', hot: 'Hot', warm: 'Warm', cold: 'Cold', not_interested: 'Not interested',
  callback_requested: 'Callback', unreachable: 'Unreachable', unclassified: 'Needs review',
};
const RESULT = {
  scheduled: 'Scheduled', queued: 'Queued', initiated: 'Dialling', ringing: 'Ringing', 'in-progress': 'On call',
  'call-disconnected': 'Wrapping up', completed: 'No conversation', 'no-answer': 'No answer', busy: 'Busy',
  failed: 'Failed', error: 'Failed', canceled: 'Cancelled', stopped: 'Stopped', 'balance-low': 'Out of credit',
};
const CAMPAIGN_STATUS = { draft: 'Draft', running: 'Calling', done: 'Finished', stopped: 'Stopped', interrupted: 'Interrupted' };
const OUTCOME = {
  hot: 'Clear intent.', warm: 'Still comparing.', cold: 'Not ready yet.',
  callback_requested: 'Wants a call back.', not_interested: 'Not interested.',
};
const ACTIVE_WINDOW_MS = 10 * 60 * 1000;

const tabFromHash = () => { const h = location.hash.slice(1); return Object.hasOwn(TABS, h) ? h : 'overview'; };
let tab = tabFromHash();
const state = {
  search: '', filter: '', selected: new Set(), cName: '', cProject: '', calls: [], names: new Map(),
  activeLeads: new Set(), seenAppts: null, freshAppts: new Set(),
};
let meta = {};

async function get(path) {
  const r = await fetch(path);
  if (r.status === 401) location.replace('/login');
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
async function post(path, body, raw) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'x-propreach-client': 'dashboard' },
    body: raw ? body : JSON.stringify(body ?? {}),
  });
  if (r.status === 401) location.replace('/login');
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(out.error || r.statusText);
  return out;
}

/** Brief good news. Problems use showProblem, which stays until dismissed. */
function toast(msg, ms = 3500) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  $($('#dlg').open ? '#dlgToasts' : '#toasts').append(t);
  setTimeout(() => t.remove(), ms);
}
function showProblem(msg) {
  const box = $($('#dlg').open ? '#dlgProblem' : '#problem');
  box.querySelector('span').textContent = msg;
  box.hidden = false;
}
const act = (fn) => async (...a) => { try { await fn(...a); } catch (e) { showProblem(e.message); } };
/** Runs an action with its button disabled, so a double-click cannot repeat it. */
async function once(button, fn) {
  button.disabled = true;
  try { return await fn(); } finally { button.disabled = false; }
}
/** Confirmation dialog. Neither button is the default, so a stray Return cannot confirm it. */
function ask({ title, body, confirm }) {
  const dlg = $('#ask');
  $('#askTitle').textContent = title; $('#askBody').textContent = body; $('#askYes').textContent = confirm;
  dlg.returnValue = '';
  dlg.showModal();
  return new Promise((resolve) => dlg.addEventListener('close', () => resolve(dlg.returnValue === 'yes'), { once: true }));
}

const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const badge = (s) => `<span class="badge ${esc(s)}">${esc(LABEL[s] ?? s)}</span>`;
const price = (l) => (l == null ? '–' : l >= 100 ? `₹${+(l / 100).toFixed(2)} Cr` : `₹${+l.toFixed(1)} L`);
const hhmm = (t) => {
  const [h, m] = t.split(':').map(Number);
  return `${h % 12 || 12}${m ? `:${String(m).padStart(2, '0')}` : ''} ${h < 12 ? 'AM' : 'PM'}`;
};
const day = (d) => new Date(`${d}T00:00:00`).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
const dur = (s) => (s ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s` : '–');
const utc = (s) => new Date(`${s.replace(' ', 'T')}Z`);
const when = (s) => (s ? utc(s).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '–');
const nowIST = () => new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Kolkata' }).slice(0, 16);
const need = (l) => [l.pref_bhk && `${l.pref_bhk} BHK`, l.pref_location, l.budget_lakh && price(l.budget_lakh)].filter(Boolean).join(' · ') || '–';
const isActive = (c) => !c.ended_at && Date.now() - utc(c.created_at) < ACTIVE_WINDOW_MS;
const resultOf = (c) => (c.connected ? 'Connected' : isActive(c) ? RESULT[c.status] ?? 'On call' : RESULT[c.status] ?? c.status);
/** A table cell that carries its own label, for the card layout on phones. */
const cell = (label, html, cls = '') => `<td data-label="${label}" class="${cls}${html === '–' || html === '' ? ' blank' : ''}">${html}</td>`;

function transcriptHtml(text) {
  if (!text) return '<p class="small">No transcript for this call.</p>';
  return `<div class="transcript">${text.split('\n').filter(Boolean).map((line) => {
    const m = line.match(/^(assistant|user):\s*(.*)$/i);
    if (!m) return `<p class="small">${esc(line)}</p>`;
    const user = m[1].toLowerCase() === 'user';
    return `<p class="${user ? 'u' : ''}"><b>${user ? 'Customer' : 'Asha (AI)'}:</b> ${esc(m[2])}</p>`;
  }).join('')}</div>`;
}

function recordingHtml(call) {
  if (!call.has_recording) return '';
  return `<audio controls preload="none" src="/api/calls/${Number(call.id)}/recording"></audio>`;
}

function headline(o) {
  if (!o.leads) return 'Add leads so Asha can start calling.';
  if (!o.attemptedLeads) return 'Asha is ready to start calling.';
  const reached = `Asha reached ${o.connectedLeads} of ${plural(o.leads, 'lead')}`;
  return o.visitLeads ? `${reached} and booked ${plural(o.visitLeads, 'site visit')}.` : `${reached}. No visits booked yet.`;
}

function storyLine(s) {
  const who = `<button class="rowlink" data-lead="${s.lead_id}">${esc(s.lead)}</button>`;
  const at = s.date ? `${day(s.date)}, ${hhmm(s.time)}` : '';
  if (s.kind === 'visit') return `Asha booked ${who} for ${at}.`;
  if (s.kind === 'callback') return `Asha set up a consultant call with ${who} for ${at}.`;
  if (s.kind === 'optout') return `${who} asked not to be called again.`;
  return `Asha spoke with ${who}. ${OUTCOME[s.status] ?? 'Needs a review.'}`;
}

const storyHtml = (s) => `<article class="story">
    <div class="spread"><h3>${storyLine(s)}</h3><time class="small">${when(s.when)}</time></div>
    ${s.quote ? `<blockquote>“${esc(s.quote)}”</blockquote>` : ''}
    ${s.note ? `<p class="note"><span class="small">AI summary:</span> ${esc(s.note)}</p>` : ''}
    ${s.details.length ? `<p class="facts">${s.details.map(esc).join(' · ')}</p>` : ''}
  </article>`;

const views = {
  async overview() {
    const o = meta;
    const [appts, stories] = await Promise.all([get('/api/appointments'), get('/api/activity')]);
    const steps = [
      ['Leads', o.leads], ['Called', o.attemptedLeads], ['Reached', o.connectedLeads],
      ['Interested', o.interested], ['Qualified', o.qualified], ['Hot', o.hot], ['Booked a visit', o.visitLeads],
    ];
    const totals = [plural(o.attempted, 'call') + ' attempted', `${o.connected} connected`, plural(o.visits, 'site visit'), plural(o.callbacks, 'human callback')];
    const now = nowIST();
    const next = appts.filter((a) => a.status === 'scheduled' && `${a.date} ${a.time}` >= now).slice(0, 4);
    return `<p class="eyebrow">${esc(o.company.name)}</p><h1>${esc(headline(o))}</h1>
      <div class="home">
        <section class="feed" aria-labelledby="feedTitle"><h2 id="feedTitle">What Asha did</h2>

function links() {
  const box = $('#links');
  if (!box.children.length) {
    box.innerHTML = Object.entries(TABS).map(([k, v]) => `<a href="#${k}"><span class="full">${v}</span><span class="short">${SHORT_TABS[k] ?? v}</span></a>`).join('');
  }
  for (const a of box.children) {
    const on = a.hash === `#${tab}`;
    a.classList.toggle('on', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  document.title = `${TABS[tab]} · PropReach AI`;
}

/** Builds a selector that finds the same control again after the page is rebuilt. */
function focusSelector(el) {
  if (!el || el === document.body) return null;
  if (el.id) return `#${el.id}`;
  const attrs = Object.entries(el.dataset ?? {}).map(([k, v]) => `[data-${k.replace(/[A-Z]/g, (c) => `-${c.toLowerCase()}`)}="${CSS.escape(v)}"]`);
  return attrs.length ? attrs.join('') : null;
}

let renderId = 0;
let lastHtml = '';
async function render() {
  const id = ++renderId;
  const fetched = await get('/api/overview');
  meta = fetched;
  $('#status').innerHTML = `<span class="dot ${meta.calling ? 'on' : ''}"></span>${meta.calling ? 'Calling is on' : 'Calling is off'}`;
  $('#signout').hidden = !meta.signInRequired;
  const html = await views[tab]();
  if (id !== renderId || html === lastHtml) return;
  const active = document.activeElement;
  const selector = focusSelector(active);
  const caret = active?.selectionStart;
  const scroll = [...document.querySelectorAll('.tablewrap')].map((w) => w.scrollLeft);
  lastHtml = html;
  $('#view').innerHTML = html;
  document.querySelectorAll('.tablewrap').forEach((w, i) => { w.scrollLeft = scroll[i] ?? 0; });
  const el = selector && $(selector);
  if (el) {
    el.focus({ preventScroll: true });
    if (caret != null) { try { el.setSelectionRange(caret, caret); } catch { /* inputs without a caret */ } }
  }
}
const safeRender = () => render().catch((e) => {
  lastHtml = '';
  $('#view').innerHTML = `<div class="card">Could not load: ${esc(e.message)}</div>`;
});

/** Refreshes what must stay current on every tab: the active call banner and new bookings. */
async function pollLive() {
  const [calls, appts] = await Promise.all([get('/api/calls'), get('/api/appointments')]);
  state.calls = calls;
  const active = calls.filter(isActive);
  state.activeLeads = new Set(active.map((c) => c.lead_id));
  const live = $('#live');
  live.hidden = !active.length;
  live.innerHTML = active.length ? `<i></i>${active.map((c) => {
    const secs = Math.max(0, Math.floor((Date.now() - utc(c.created_at)) / 1000));
    return `Asha · ${esc(RESULT[c.status] ?? 'On call')}: ${esc(c.lead ?? c.phone ?? 'Unknown')} · ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
  }).join(' &nbsp;|&nbsp; ')}` : '';

  const scheduled = appts.filter((a) => a.status === 'scheduled');
  if (state.seenAppts) {
    for (const a of scheduled.filter((x) => !state.seenAppts.has(x.id))) {
      const what = a.type === 'visit' ? `Asha booked a visit: ${a.lead}, ${a.project}` : `Asha set up a callback: ${a.lead}`;
      toast(`${what}, ${day(a.date)}, ${hhmm(a.time)}`, 8000);
      state.freshAppts.add(a.id);
      setTimeout(() => { state.freshAppts.delete(a.id); }, 15000);
    }
  }
  state.seenAppts = new Set(appts.map((a) => a.id));
}

async function poll() {
  if (document.hidden) return;
  try {
    await pollLive();
    // Rebuilding would close an open dropdown or disturb a dialog.
    if (!$('#dlg').open && !$('#ask').open && document.activeElement?.tagName !== 'SELECT') await render();
  } catch {
    $('#status').innerHTML = '<span class="dot"></span>Reconnecting…';
  }
}

document.addEventListener('click', act(async (e) => {
  const t = e.target.closest('button,[data-lead],[data-callrow]');
  if (!t) return;
  const d = t.dataset;
  if (d.ask) return $('#ask').close(d.ask);
  if ('close' in d) return $('#dlg').close();
  if ('dismiss' in d) { t.parentElement.hidden = true; return; }
  if ('logout' in d) { await post('/logout'); location.replace('/login'); return; }
  if ('clear' in d) {
    const yes = await ask({ title: 'Clear sample data?', body: "This deletes the sample leads, calls and appointments. It can't be undone.", confirm: 'Clear data' });
    if (!yes) return;
    await post('/api/samples/clear');
    toast('Sample data cleared');
    return safeRender();
  }
  if (d.call) {
    await once(t, () => post(`/api/leads/${d.call}/call`));
    toast('Calling now. Follow it in Call history.');
    await pollLive().catch(noop);
    return safeRender();
  }
  if ('addlead' in d) return openDlg(FORMS.lead);
  if ('upload' in d) return openDlg(FORMS.csv);
  if ('addproject' in d) return openDlg(FORMS.project);
  if (d.appt) {
    if (d.to === 'cancelled') {
      const noun = d.kind === 'visit' ? 'visit' : 'callback';
      const yes = await ask({ title: `Call off this ${noun}?`, body: "The buyer isn't told automatically, so let them know.", confirm: `Call off ${noun}` });
      if (!yes) return;
    }
    await once(t, () => post(`/api/appointments/${d.appt}`, { status: d.to }));
    return safeRender();
  }
  if (d.pickall) {
    document.querySelectorAll('[data-pick]').forEach((box) => {
      const id = Number(box.dataset.pick);
      if (d.pickall === 'all') state.selected.add(id); else state.selected.delete(id);
    });
    return safeRender();
  }
  if ('launch' in d) {
    const lead_ids = [...state.selected].filter((id) => $(`[data-pick="${id}"]`));
    const select = $('#cProject');
    const project = state.cProject ? select.selectedOptions[0]?.textContent : '';
    const yes = await ask({
      title: `Call ${lead_ids.length === 1 ? '1 person' : `${lead_ids.length} people`} now?`,
      body: launchSummary(lead_ids, project), confirm: 'Start calling',
    });
    if (!yes) return;
    await once(t, () => post('/api/campaigns', { name: state.cName, project_id: Number(state.cProject) || null, lead_ids }));
    state.selected.clear(); state.cName = ''; state.cProject = '';
    toast('Campaign started');
    return safeRender();
  }
  if (d.stop) {
    const yes = await ask({ title: 'Stop this campaign?', body: 'No new calls will start, and queued calls are cancelled. Calls already ringing or connected will finish.', confirm: 'Stop campaign' });
    if (!yes) return;
    await once(t, () => post(`/api/campaigns/${d.stop}/stop`));
    toast('Campaign stopped');
    return safeRender();
  }
  if (d.dnc) {
    const on = d.value === '1';
    const yes = await ask(on
      ? { title: 'Mark as do not call?', body: "Asha won't call this person again, and their booked visits and callbacks are called off.", confirm: 'Mark do not call' }
      : { title: 'Allow calls again?', body: 'Only do this if this person asked to be contacted again.', confirm: 'Allow calls' });
    if (!yes) return;
    await post(`/api/leads/${d.dnc}`, { do_not_call: on });
    return showLead(d.dnc);
  }
  if (d.lead) return showLead(d.lead);
  if (d.callrow) return showCall(Number(d.callrow));
}));

document.addEventListener('change', act(async (e) => {
  const { id, dataset, value, checked } = e.target;
  if (dataset.pick) {
    const lead = Number(dataset.pick);
    if (checked) state.selected.add(lead); else state.selected.delete(lead);
    safeRender();
  }
  if (id === 'filter') { state.filter = value; safeRender(); }
  if (id === 'cProject') state.cProject = value;
  if (id === 'leadStatus') {
    await post(`/api/leads/${dataset.id}`, { status: value });
    toast('Lead status updated');
    await showLead(dataset.id);
  }
}));
document.addEventListener('input', (e) => {
  if (e.target.id === 'search') { state.search = e.target.value; safeRender(); }
  if (e.target.id === 'cName') state.cName = e.target.value;
});

document.addEventListener('submit', act(async (e) => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  $('#dlgProblem').hidden = true;
  const f = Object.fromEntries(new FormData(form));
  await once(form.querySelector('button.primary'), async () => {
    if (form.dataset.form === 'lead') {
      await post('/api/leads', { ...f, consent: f.consent ? 'yes' : '', source: 'Manual' });
      toast('Lead added');
    }
    if (form.dataset.form === 'csv') {
      const r = await post('/api/leads/csv', await f.file.text(), true);
      if (!r.added && r.errors.length) throw new Error(`Nothing added. First problem: ${r.errors[0]}`);
      const notes = [r.errors.length && `${r.errors.length} skipped`, r.noConsent && `${r.noConsent} without consent will not be called`];
      toast(`Added ${r.added}. ${notes.filter(Boolean).join('. ')}`.trim(), 6000);
    }
    if (form.dataset.form === 'project') {
      const { bhk, size_sqft, price_lakh, units_left, ...rest } = f;
      await post('/api/projects', { ...rest, configs: [{ bhk, size_sqft, price_lakh, units_left }] });
      toast('Project saved. Asha can use it now.');
    }
  });
  $('#dlg').close();
}));

$('#dlg').addEventListener('close', () => { safeRender(); });
addEventListener('hashchange', () => { tab = tabFromHash(); links(); scrollTo(0, 0); safeRender(); });
setInterval(poll, 4000);
links();
pollLive().catch(noop).finally(safeRender);
</script>
</body>
</html>
