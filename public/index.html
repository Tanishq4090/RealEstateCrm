<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PropReach</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23ea580c'/><path d='M8 25V13l8-6 8 6v12h-5v-7h-6v7z' fill='%23fff'/></svg>">
<style>
:root{color-scheme:light;
  --bg:#efeae3;--side:#f7f3ed;--raise:#faf7f2;--ink:#241c16;--muted:#5e544b;--line:#e2d9ce;--field:#94867a;--hover:#f3ede5;--tint:#ece5db;
  --orange:#ea580c;--accent:#b23f08;--accent-hover:#963405;--on-accent:#fffaf5;--accent-soft:#f6e3d3;
  --hot:#a11d0e;--hot-soft:#f8e0da;--warm:#744a00;--warm-soft:#f5e8cd;--callback:#6a3d5c;--callback-soft:#efe2ea;--cold:#44525c;--cold-soft:#e2e7ea;
  --good:#256044;--good-soft:#dcedE2;--neutral:#574d44;--neutral-soft:#e9e2d8;--backdrop:#241c1659;--shadow:0 1px 2px #241c160d}
*{box-sizing:border-box}[hidden]{display:none!important}html{font-size:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:.9375rem/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--accent);text-underline-offset:.2em}a:hover{color:var(--accent-hover)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:.25rem}
svg.icon{width:1.0625rem;height:1.0625rem;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3,p{margin:0}

/* Frame */
.app{display:grid;grid-template-columns:14.5rem minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:1rem .75rem;background:var(--side);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.5625rem;padding:.25rem .5rem .875rem;font-weight:650;font-size:1rem;letter-spacing:-.01em;color:var(--ink);text-decoration:none}.brand:hover{color:var(--ink)}
.tile{display:grid;place-items:center;width:1.625rem;height:1.625rem;border-radius:.375rem;background:var(--orange);color:#fff}.tile svg{width:.9375rem;height:.9375rem;fill:currentColor;stroke:none}
.navgroup{display:contents}.navlabel{font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:1.125rem .5rem .3125rem}
#links a{display:flex;align-items:center;gap:.625rem;padding:.4375rem .5rem;border-radius:.375rem;color:var(--ink);text-decoration:none;margin-bottom:1px}
#links a svg{color:var(--muted)}#links a:hover{background:var(--hover)}#links a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}#links a.on svg{color:var(--accent)}
.count{margin-left:auto;font-size:.75rem;font-weight:500;color:var(--muted)}#links a.on .count{color:var(--accent)}.count:empty{display:none}#links a[href="#more"]{display:none}
.account{margin-top:auto;padding:.75rem .25rem 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:.625rem;min-width:0}
.account>div{min-width:0;flex:1}.account b{display:block;font-size:.875rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.account span.state{font-size:.8125rem;color:var(--muted);white-space:nowrap}.accountrow{display:flex;align-items:center;justify-content:space-between;gap:.5rem}#signout{font-size:.8125rem;padding:0 .125rem}
.dot{display:inline-block;width:.4375rem;height:.4375rem;border-radius:50%;margin-right:.3125rem;background:var(--field);vertical-align:.08em}.dot.on{background:var(--good)}
main{min-width:0}
.pagehead{position:sticky;top:0;z-index:5;background:var(--raise);border-bottom:1px solid var(--line)}
.pagehead .inner{max-width:76rem;margin:0 auto;padding:.875rem 2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
h1{font-size:1.25rem;line-height:1.3;font-weight:650;letter-spacing:-.012em}.sub{color:var(--muted);font-size:.875rem;margin-top:.0625rem}
.actions{display:flex;gap:.5rem;align-items:center}
.content{max-width:76rem;margin:0 auto;padding:1.5rem 2rem 3rem}
.enter{animation:rise .16s ease-out}@keyframes rise{from{opacity:0}}
.small{color:var(--muted);font-size:.8125rem}.strong{font-weight:600}

/* Cards */
.card,.tablecard,.kpis{background:var(--raise);border:1px solid var(--line);border-radius:.5rem;box-shadow:var(--shadow)}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem 1.125rem;border-bottom:1px solid var(--line)}.cardhead h2{font-size:.9375rem;font-weight:600}.cardhead a{font-size:.8125rem;font-weight:500;text-decoration:none}.cardhead a:hover{text-decoration:underline}
.cardbody{padding:1rem 1.125rem}.emptyline{padding:1rem 1.125rem;color:var(--muted);font-size:.875rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(10.5rem,100%),1fr));gap:1px;background:var(--line);margin-bottom:1.25rem;overflow:hidden}
.kpi{display:block;padding:.9375rem 1.125rem;background:var(--raise);color:var(--ink);text-decoration:none}a.kpi:hover{background:var(--hover);color:var(--ink)}
.kpi span{display:block;color:var(--muted);font-size:.8125rem}.kpi b{display:block;font-size:1.625rem;line-height:1.25;font-weight:650;letter-spacing:-.02em;margin:.125rem 0}
.columns{display:flex;flex-wrap:wrap;gap:1.25rem;align-items:flex-start}.columns>*{flex:1 1 20rem;min-width:0}.columns>:first-child{flex:1.5 1 26rem}.stack{display:grid;gap:1.25rem;min-width:0}
.item{display:flex;align-items:center;gap:.75rem;width:100%;padding:.6875rem 1.125rem;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:var(--ink);text-decoration:none}.item:first-of-type{border-top:0}
a.item:hover,button.item:hover{background:var(--hover);color:var(--ink);cursor:pointer}.item .grow{flex:1;min-width:0}.item svg{color:var(--muted)}
.when{text-align:right;white-space:nowrap;font-size:.8125rem;color:var(--muted)}
.activity{display:flex;gap:.75rem;padding:.75rem 1.125rem;border-top:1px solid var(--line)}.activity:first-of-type{border-top:0}.activity .grow{flex:1;min-width:0}
.quote{margin:.375rem 0 .125rem;padding-left:.75rem;border-left:2px solid var(--orange);color:var(--ink)}
.avatar{display:inline-grid;place-items:center;flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--tint);color:var(--neutral);font-size:.75rem;font-weight:600;letter-spacing:.02em}
.who{display:flex;align-items:center;gap:.625rem;min-width:0}.who>div{min-width:0}
.foot{margin-top:1rem;font-size:.8125rem;color:var(--muted)}

/* Filters */
.toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;border-bottom:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:1.25rem;margin-bottom:-1px}.tabs button{padding:.4375rem 0 .5625rem;color:var(--muted);font-size:.875rem;font-weight:500;border-bottom:2px solid transparent}.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}.tabs span{margin-left:.3125rem;font-size:.75rem;color:var(--muted)}.tabs .on span{color:var(--accent)}
.toolbar input{width:14rem;margin-bottom:.5rem;padding:.375rem .625rem;font-size:.875rem}

/* Tables */
.tablecard{overflow:hidden}table.list{width:100%;border-collapse:collapse}
.list th{text-align:left;font-size:.75rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);background:var(--hover);padding:.5rem 1rem;border-bottom:1px solid var(--line);white-space:nowrap}
.list td{padding:.5625rem 1rem;border-bottom:1px solid var(--line);vertical-align:middle;font-size:.875rem}.list tr:last-child td{border-bottom:0}
.list tr.click{cursor:pointer}.list tr.click:hover td{background:var(--hover)}.list td.end{text-align:right;white-space:nowrap}.list .num{text-align:right}.list th.num{text-align:right}
.list tr.group td{background:var(--hover);font-size:.75rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);padding:.3125rem 1rem}
.rowlink{all:unset;cursor:pointer;font-weight:600;font-size:.875rem;display:block}.rowlink:hover{color:var(--accent)}.rowlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.textlink{all:unset;cursor:pointer;font-weight:600}.textlink:hover{color:var(--accent)}.textlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:.3125rem;padding:.0625rem .5rem;border-radius:99px;font-size:.75rem;font-weight:600;white-space:nowrap;background:var(--neutral-soft);color:var(--neutral)}
.pill.hot{background:var(--hot-soft);color:var(--hot)}.pill.warm{background:var(--warm-soft);color:var(--warm)}.pill.callback_requested{background:var(--callback-soft);color:var(--callback)}.pill.cold{background:var(--cold-soft);color:var(--cold)}.pill.good{background:var(--good-soft);color:var(--good)}
.overdue{background:var(--hot-soft);color:var(--hot);font-size:.75rem;font-weight:600;border-radius:.25rem;padding:0 .3125rem;margin-left:.375rem}
.empty{color:var(--muted);padding:2.5rem 1rem;text-align:center}.clip{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:24rem}
.progress{display:flex;align-items:center;gap:.625rem;min-width:9rem}.progress .bar{flex:1}
.bar{background:var(--tint);border-radius:99px;height:.375rem;overflow:hidden}.bar i{display:block;height:100%;background:var(--orange);border-radius:99px;min-width:2px}
.barrow{display:grid;grid-template-columns:7rem 1fr 2rem 2.75rem;gap:.75rem;align-items:center;font-size:.875rem;padding:.3125rem 0}.barrow b{font-weight:600;text-align:right}.barrow .small{text-align:right}
.unit{display:flex;justify-content:space-between;gap:1rem;padding:.3125rem 0;font-size:.875rem}

/* Controls */
button{cursor:pointer;border:0;background:none}button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--accent);color:var(--on-accent);font-weight:600;font-size:.875rem;padding:.4375rem .875rem;border-radius:.375rem;white-space:nowrap;box-shadow:var(--shadow)}.primary:hover{background:var(--accent-hover)}
.secondary{background:var(--raise);border:1px solid var(--field);font-size:.875rem;font-weight:500;padding:.375rem .75rem;border-radius:.375rem;white-space:nowrap;box-shadow:var(--shadow)}.secondary:hover{background:var(--hover)}
.quiet{color:var(--accent);font-size:.875rem;font-weight:500;padding:.25rem .375rem;border-radius:.25rem}.quiet:hover{color:var(--accent-hover);text-decoration:underline;text-underline-offset:.2em}.dull{color:var(--muted)}
input,select,textarea{width:100%;padding:.5rem .625rem;border:1px solid var(--field);border-radius:.375rem;background:var(--raise)}input[type=checkbox]{width:auto;accent-color:var(--accent)}
label{display:block;font-size:.875rem;font-weight:500;color:var(--ink);margin-bottom:.875rem}label input,label select,label textarea{margin-top:.25rem;font-weight:400;font-size:.9375rem}
label.check{display:flex;gap:.625rem;align-items:center;font-weight:400;font-size:.9375rem}label.check input{margin:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:0 .875rem}.picks{max-height:14rem;overflow:auto;margin-bottom:.875rem}
.spread{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.375rem}
details{margin-top:.5rem}summary{cursor:pointer;color:var(--muted);font-size:.875rem}summary:hover{color:var(--ink)}

/* Status */
.live{display:block;background:var(--accent-soft);color:var(--ink);text-decoration:none;padding:.4375rem 2rem;font-size:.875rem;font-weight:600;border-bottom:1px solid var(--line)}.live:hover{color:var(--accent)}
.live i{display:inline-block;width:.4375rem;height:.4375rem;border-radius:50%;background:var(--orange);margin-right:.5rem;animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.35}}
.problem{display:flex;gap:.75rem;align-items:center;justify-content:space-between;background:var(--accent-soft);padding:.5rem 2rem;font-size:.875rem}.sheet .problem{margin:1rem 0 0;padding:.5rem .75rem;border-radius:.375rem}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--raise);padding:.5rem 1rem;border-radius:.5rem;z-index:50;max-width:calc(100vw - 2rem);font-size:.875rem}

/* Side sheet and confirmations */
dialog{border:0;padding:0;color:var(--ink);background:var(--raise)}dialog::backdrop{background:var(--backdrop)}
#dlg{margin:0 0 0 auto;width:min(33rem,100vw);height:100dvh;max-height:100dvh;max-width:100vw;border-left:1px solid var(--line)}#dlg[open]{animation:slide .16s ease-out}@keyframes slide{from{opacity:0;transform:translateX(1rem)}}
.sheet{padding:1.5rem 1.5rem 2.5rem}.sheet header{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem}.sheet h2.title{font-size:1.1875rem;line-height:1.3;font-weight:650}
.section{margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--line)}.section h3{font-size:.75rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.facts{display:grid;grid-template-columns:6.5rem 1fr;gap:.25rem 1rem;margin:0;font-size:.875rem}.facts dt{color:var(--muted)}.facts dd{margin:0}
.correct{display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap}.correct label{margin:0;flex:1 1 11rem}
audio{width:100%;margin:.5rem 0}.call+.call{margin-top:1rem}.transcript{margin-top:.625rem;font-size:.875rem}.transcript p{margin-bottom:.5rem}.transcript .who-said{display:block;font-size:.75rem;font-weight:600;color:var(--muted)}
#ask{margin:auto;width:min(25rem,calc(100vw - 2rem));border-radius:.625rem}#ask h2{outline:0;font-size:1.0625rem;font-weight:650;margin-bottom:.375rem}#ask p{color:var(--muted);font-size:.875rem;margin-bottom:1.25rem}#ask .sheet{padding:1.25rem 1.375rem}
.confirm{display:flex;justify-content:flex-end;gap:.5rem}.confirm button:first-child{background:var(--raise);border:1px solid var(--field);font-size:.875rem;padding:.375rem .75rem;border-radius:.375rem}
.morelist a,.morelist button{display:flex;align-items:center;gap:.75rem;width:100%;min-height:3.25rem;padding:0 1.125rem;color:var(--ink);text-decoration:none;border-top:1px solid var(--line);text-align:left}.morelist a:first-child{border-top:0}.morelist svg{color:var(--muted)}

@media (prefers-reduced-motion:reduce){.enter,#dlg[open]{animation:none}.live i{animation:none}}

/* In em, so a larger browser font also moves to this layout. */
@media (max-width:47.5em){
  body{font-size:1rem}.app{display:block}.side{position:static;height:auto;flex-direction:row;align-items:center;padding:.375rem 1rem;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0;min-height:2.75rem}.account,.navlabel{display:none}
  #links{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--side);border-top:1px solid var(--line);padding:.25rem .25rem calc(.25rem + env(safe-area-inset-bottom))}
  #links a{flex-direction:column;justify-content:center;gap:.125rem;min-height:3.125rem;margin:0;padding:.125rem;font-size:.75rem}#links .count{display:none}
  #links a[href="#campaigns"],#links a[href="#projects"],#links a[href="#reports"]{display:none}#links a[href="#more"]{display:flex}
  .pagehead{position:static}.pagehead .inner{padding:.75rem 1rem}.content{padding:1rem 1rem calc(5.5rem + env(safe-area-inset-bottom))}.actions{width:100%}.actions button{flex:1}
  .primary,.secondary,input,select,.confirm button{min-height:2.75rem}.quiet{min-height:2.75rem;padding:0 .5rem}.tabs{gap:1rem}.tabs button{min-height:2.75rem}.toolbar input{width:100%;margin-bottom:.625rem;font-size:1rem}
  input,select,textarea,label input,label select{font-size:1rem}.item{min-height:3.25rem}.cardhead a{display:inline-flex;align-items:center;min-height:2.75rem}.cardhead{padding-top:.25rem;padding-bottom:.25rem;min-height:2.875rem}
  .textlink{position:relative}.textlink::after{content:"";position:absolute;inset:-.75rem 0}.rowlink{display:inline-flex;align-items:center;min-height:2.75rem}summary{line-height:2.75rem}label.check{min-height:2.75rem}input[type=checkbox]{width:1.25rem;height:1.25rem}.split{grid-template-columns:1fr}
  .tablecard{background:none;border:0;box-shadow:none;border-radius:0;overflow:visible}table.list,table.list tbody{display:block}.list thead{display:none}
  .list tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 .75rem;background:var(--raise);border:1px solid var(--line);border-radius:.5rem;padding:.5rem .875rem;margin-bottom:.5rem}
  .list tr.click:hover td{background:none}.list td{display:block;padding:.0625rem 0;border:0;grid-column:1/-1}.list td.lead{grid-column:1;grid-row:1}.list td.tag{grid-column:2;grid-row:1;align-self:center}.list td.blank{display:none}.list .num{text-align:left}
  .list td[data-label]::before{content:attr(data-label) ": ";color:var(--muted)}.list td.end{text-align:left;display:flex;gap:.5rem;flex-wrap:wrap}.list td.end button{flex:1}.clip{max-width:100%;white-space:normal}
  .list tr.group{display:block;background:none;border:0;padding:.375rem 0 .125rem;margin:0}.list tr.group td{background:none;padding:0}
  .toast{bottom:calc(5rem + env(safe-area-inset-bottom))}.sheet{padding:1.25rem 1rem 2.5rem}.barrow{grid-template-columns:6rem 1fr 1.5rem 2.5rem}.live,.problem{padding-left:1rem;padding-right:1rem}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#overview"><span class="tile"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10l7-5.5L19 10v10h-4.5v-6h-5v6z"/></svg></span>PropReach</a>
    <nav id="links" aria-label="Main"></nav>
    <div class="account">
      <span class="avatar" id="accountAvatar" aria-hidden="true"></span>
      <div><b id="company"></b><div class="accountrow"><span class="state" id="status"></span><button id="signout" class="quiet dull" data-logout hidden>Sign out</button></div></div>
    </div>
  </aside>
  <main>
    <a class="live" id="live" href="#calls" hidden></a>
    <div class="problem" id="problem" role="alert" hidden><span></span><button class="quiet" data-dismiss>Dismiss</button></div>
    <div id="view"></div>
  </main>
</div>
<div id="toasts" role="status"></div>
<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="sheet"><div id="dlgBody"></div><div class="problem" id="dlgProblem" role="alert" hidden><span></span><button class="quiet" data-dismiss>Dismiss</button></div></div>
  <div id="dlgToasts" role="status"></div>
</dialog>
<dialog id="ask" aria-labelledby="askTitle" aria-describedby="askBody">
  <div class="sheet">
    <h2 id="askTitle" tabindex="-1" autofocus></h2>
    <p id="askBody"></p>
    <div class="confirm"><button data-ask="no">Cancel</button><button class="primary" id="askYes" data-ask="yes"></button></div>
  </div>
</dialog>
<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const noop = () => {};

const TABS = { overview: 'Overview', leads: 'Leads', calls: 'Calls', appointments: 'Visits', campaigns: 'Campaigns', projects: 'Projects', reports: 'Reports', more: 'More' };
const NAV = [
  { items: ['overview'] },
  { label: 'Sales', items: ['leads', 'calls', 'appointments'] },
  { label: 'Manage', items: ['campaigns', 'projects', 'reports'] },
  { items: ['more'] },
];
const ICONS = {
  overview: '<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/>',
  leads: '<circle cx="9" cy="8" r="3.5"/><path d="M3 20c.5-4 3-6 6-6s5.500 2 6 6"/><path d="M16 5a3.500 3.500 0 010 6.500"/><path d="M18 14.500c1.800.8 2.800 2.800 3 5.500"/>',
  calls: '<path d="M5 4h4l2 5-2.500 1.500a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A15 15 0 013 6a2 2 0 012-2z"/>',
  appointments: '<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/>',
  campaigns: '<path d="M4 10v4l11 5V5z"/><path d="M15 9a3 3 0 010 6"/><path d="M7 15l1 5h3l-1-4"/>',
  projects: '<rect x="5" y="3" width="14" height="18" rx="1.500"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M10 21v-5h4v5"/>',
  reports: '<path d="M5 20V10M12 20V4M19 20v-7"/>',
  more: '<circle cx="5" cy="12" r="1.200"/><circle cx="12" cy="12" r="1.200"/><circle cx="19" cy="12" r="1.200"/>',
  arrow: '<path d="M9 6l6 6-6 6"/>',
};
const icon = (name) => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
const LABEL = {
  new: 'New', hot: 'Hot', warm: 'Warm', callback_requested: 'Callback', cold: 'Cold',
  unclassified: 'Needs review', unreachable: 'Unreachable', not_interested: 'Not interested',
};
const RESULT = {
  scheduled: 'Scheduled', rescheduled: 'Scheduled', prepared: 'Queued', queued: 'Queued', initiated: 'Dialling', ringing: 'Ringing', 'in-progress': 'On call',
  'call-disconnected': 'Wrapping up', completed: 'No conversation', 'no-answer': 'No answer', busy: 'Busy',
  failed: 'Failed', error: 'Failed', canceled: 'Cancelled', stopped: 'Stopped', 'balance-low': 'Out of credit',
};

  hot: 'Clear intent.', warm: 'Still comparing.', cold: 'Not ready yet.',

};

  search: '', leadFilter: '', callFilter: '', visitFilter: 'upcoming', selected: new Set(), cName: '', cProject: '',
  calls: [], names: new Map(), projects: [], activeLeads: new Set(), seenAppts: null, upcoming: 0,
};

async function get(path) {
  const r = await fetch(path);
  if (r.status === 401) location.replace('/login');
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
async function post(path, body, raw) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'x-propreach-client': 'dashboard' },
    body: raw ? body : JSON.stringify(body ?? {}),
  });
  if (r.status === 401) location.replace('/login');
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(out.error || r.statusText);
  return out;
}

/** Brief good news. Problems use showProblem, which stays until dismissed. */
function toast(msg, ms = 3500) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  $($('#dlg').open ? '#dlgToasts' : '#toasts').append(t);
  setTimeout(() => t.remove(), ms);
}
function showProblem(msg) {
  const box = $($('#dlg').open ? '#dlgProblem' : '#problem');
  box.querySelector('span').textContent = msg;
  box.hidden = false;
}
const act = (fn) => async (...a) => { try { await fn(...a); } catch (e) { showProblem(e.message); } };
/** Runs an action with its button disabled, so a double-click cannot repeat it. */
async function once(button, fn) {
  button.disabled = true;
  try { return await fn(); } finally { button.disabled = false; }
}
/** Confirmation dialog. Neither button is the default, so a stray Return cannot confirm it. */
function ask({ title, body, confirm }) {
  const dlg = $('#ask');
  $('#askTitle').textContent = title; $('#askBody').textContent = body; $('#askYes').textContent = confirm;
  dlg.returnValue = '';
  dlg.showModal();
  return new Promise((resolve) => dlg.addEventListener('close', () => resolve(dlg.returnValue === 'yes'), { once: true }));
}

const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const stateWord = (s, text) => `<span class="pill ${esc(s)}">${esc(text ?? LABEL[s] ?? s)}</span>`;
const initials = (name) => String(name ?? '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const avatar = (name) => `<span class="avatar" aria-hidden="true">${esc(initials(name))}</span>`;
const price = (l) => (l == null ? '' : l >= 100 ? `₹${+(l / 100).toFixed(2)} Cr` : `₹${+l.toFixed(1)} L`);
const hhmm = (t) => {
  const [h, m] = t.split(':').map(Number);
  return `${h % 12 || 12}${m ? `:${String(m).padStart(2, '0')}` : ''} ${h < 12 ? 'AM' : 'PM'}`;
};
const day = (d) => new Date(`${d}T00:00:00`).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
const dur = (s) => (s ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s` : '');
const utc = (s) => new Date(`${s.replace(' ', 'T')}Z`);
const when = (s) => (s ? utc(s).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '');
const nowIST = () => new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Kolkata' }).slice(0, 16);
const need = (l) => [l.pref_bhk && `${l.pref_bhk} BHK`, l.pref_location, l.budget_lakh && price(l.budget_lakh)].filter(Boolean).join(' · ');
const HELD = new Set(['rescheduled', 'scheduled']);
/** Bolna has the call but will dial it later, usually because calling hours are over. */
const isHeld = (c) => !c.ended_at && HELD.has(c.status) && (!c.scheduled_at || utc(c.scheduled_at) > Date.now());
const isActive = (c) => !c.ended_at && !HELD.has(c.status) && Date.now() - utc(c.status_at ?? c.created_at) < ACTIVE_WINDOW_MS;
/** Bolna's time falls just before the hour, so it is rounded up to read 10:00, not 9:59. */
const heldUntil = (c) => (c.scheduled_at
  ? `on ${new Date(Math.ceil(utc(c.scheduled_at) / 60000) * 60000).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })}`
  : 'when calling hours open');
const resultOf = (c) => (c.connected ? 'Connected' : isHeld(c) ? `Scheduled ${heldUntil(c)}` : RESULT[c.status] ?? (isActive(c) ? 'Calling' : c.status));
/** Says only what Bolna has reported, so a call is never shown as connected before it is. */
function liveLine(c) {
  const who = esc(c.lead ?? c.phone ?? 'someone');
  if (c.status === 'ringing') return `Ringing ${who}`;
  if (c.status === 'call-disconnected') return `Call with ${who} just ended`;
  if (c.status !== 'in-progress') return `Calling ${who}`;
  const secs = Math.max(0, Math.floor((Date.now() - utc(c.status_at ?? c.created_at)) / 1000));
  return `Asha is talking to ${who} · ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
}
/** A table cell that carries its own label, for the card layout on phones. */
const cell = (label, html, cls = '') => `<td data-label="${label}" class="${cls}${html ? '' : ' blank'}">${html}</td>`;
const pageHead = (title, sub, actions = '') => `<div class="pagehead"><div class="inner"><div><h1>${esc(title)}</h1>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}</div>${actions ? `<div class="actions">${actions}</div>` : ''}</div></div>`;
const page = (head, body) => `${head}<div class="content">${body}</div>`;
const tabsHtml = (name, label, items, current) => `<div class="tabs" role="group" aria-label="${label}">${items.map(([key, text, n]) => `<button data-${name}="${key}" class="${key === current ? 'on' : ''}" aria-pressed="${key === current}">${esc(text)}${n != null ? `<span>${n}</span>` : ''}</button>`).join('')}</div>`;

function headline(o) {
  if (!o.leads) return 'Add your leads and Asha will start calling.';
  if (!o.attemptedLeads) return 'Asha is ready to start calling.';
  const reached = `Asha reached ${o.connectedLeads} of ${plural(o.leads, 'lead')}`;
  return o.visitLeads ? `${reached} and booked ${plural(o.visitLeads, 'site visit')}.` : `${reached}. No visits booked yet.`;
}

function storyLine(s) {
  const who = `<button class="textlink" data-lead="${s.lead_id}">${esc(s.lead)}</button>`;
  const at = s.date ? `${day(s.date)}, ${hhmm(s.time)}` : '';
  if (s.kind === 'visit') return `Asha booked ${who} for ${at}.`;
  if (s.kind === 'callback') return `Asha set up a consultant call with ${who} for ${at}.`;
  if (s.kind === 'optout') return `${who} asked not to be called again.`;
  if (s.kind === 'abusive') return `Asha ended the call with ${who} after abuse. Worth a look.`;
  return `Asha spoke with ${who}. ${OUTCOME[s.status] ?? 'Needs a review.'}`;
}

function links() {

  }
  const active = ['campaigns', 'projects', 'reports'].includes(tab) ? [tab, 'more'] : [tab];
  for (const a of box.querySelectorAll('a')) {
    const key = a.hash.slice(1);
    const phoneOnlyMore = key === 'more' && active.includes('more');
    const on = active.includes(key);
    a.classList.toggle('on', on || phoneOnlyMore);
    if (key === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  document.title = `${TABS[tab]} · PropReach`;
}

function updateCounts() {
  const set = (key, value) => { const el = $(`[data-count="${key}"]`); if (el) el.textContent = value || ''; };
  set('leads', meta.byStatus?.hot ? `${meta.byStatus.hot} hot` : '');
  set('appointments', state.upcoming);
}

/** Builds a selector that finds the same control again after the page is rebuilt. */
function focusSelector(el) {
  if (!el || el === document.body) return null;
  if (el.id) return `#${el.id}`;
  const attrs = Object.entries(el.dataset ?? {}).map(([k, v]) => `[data-${k.replace(/[A-Z]/g, (c) => `-${c.toLowerCase()}`)}="${CSS.escape(v)}"]`);
  return attrs.length ? attrs.join('') : null;
}

  if (id !== renderId || html === lastHtml) return;

  $('#view').innerHTML = html;
  const el = selector && $(selector);
  if (el) {
    el.focus({ preventScroll: true });
    if (caret != null) { try { el.setSelectionRange(caret, caret); } catch { /* inputs without a caret */ } }
  }
}
const safeRender = () => render().catch((e) => {
  lastHtml = '';
  $('#view').innerHTML = `<p class="empty">Could not load this page. ${esc(e.message)}</p>`;
});

/** Refreshes what must stay current on every page: the live call line and new bookings. */
async function pollLive() {
  const [calls, appts] = await Promise.all([get('/api/calls'), get('/api/appointments')]);
  state.calls = calls;
  const active = calls.filter(isActive);
  const held = calls.filter(isHeld);
  state.activeLeads = new Set([...active, ...held].map((c) => c.lead_id));
  const lines = [...active.map(liveLine), ...held.map((c) => `Asha will call ${esc(c.lead ?? c.phone ?? 'someone')} ${heldUntil(c)}`)];
  const live = $('#live');
  live.hidden = !lines.length;
  live.innerHTML = lines.length ? `${active.length ? '<i></i>' : ''}${lines.join(' &nbsp;·&nbsp; ')}` : '';

  const now = nowIST();
  const scheduled = appts.filter((a) => a.status === 'scheduled');
  state.upcoming = scheduled.filter((a) => `${a.date} ${a.time}` >= now).length;
  if (state.seenAppts) {
    for (const a of scheduled.filter((x) => !state.seenAppts.has(x.id))) {
      const what = a.type === 'visit' ? `Asha booked ${a.lead} for ${a.project}` : `Asha set up a callback with ${a.lead}`;
      toast(`${what}, ${day(a.date)}, ${hhmm(a.time)}`, 8000);
    }
  }
  state.seenAppts = new Set(appts.map((a) => a.id));
}

async function poll() {
  if (document.hidden) return;
  try {
    await pollLive();
    // Rebuilding would disturb a sheet or confirmation.
    if (!$('#dlg').open && !$('#ask').open) await render();
  } catch {
    $('#status').textContent = 'Reconnecting…';
  }
}

function openDlg(html) {
  $('#dlgBody').innerHTML = html;
  $('#dlgBody h2').id = 'dlgTitle';
  $('#dlgProblem').hidden = true;
  if (!$('#dlg').open) $('#dlg').showModal();
  $('#dlgBody form input:not([type=hidden])')?.focus();
}
const closeBtn = '<button class="quiet dull" data-close>Close</button>';
const facts = (pairs) => {
  const shown = pairs.filter(([, v]) => v);
  return shown.length ? `<dl class="facts">${shown.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : '';
};

function transcriptHtml(text) {
  if (!text) return '<p class="small">No transcript for this call.</p>';
  return `<div class="transcript">${text.split('\n').filter(Boolean).map((line) => {
    const m = line.match(/^(assistant|user):\s*(.*)$/i);
    if (!m) return `<p class="small">${esc(line)}</p>`;
    const user = m[1].toLowerCase() === 'user';
    return `<p><span class="who-said">${user ? 'Customer' : 'Asha (AI)'}</span>${esc(m[2])}</p>`;
  }).join('')}</div>`;
}

function recordingHtml(call) {
  if (!call.has_recording) return '';
  return `<audio controls preload="none" src="/api/calls/${Number(call.id)}/recording"></audio>`;
}

async function showLead(id) {
  const l = await get(`/api/leads/${id}`);
  const decidedBy = ['new', 'unreachable'].includes(l.status) ? '' : l.status_by === 'team' ? 'Set by your team' : 'Set by Asha (AI)';
  const canCall = meta.calling && !l.do_not_call && l.consent && !l.is_sample && !state.activeLeads.has(l.id);
  const why = l.is_sample ? 'Sample leads are never called.' : l.do_not_call ? 'On the do-not-call list.' : !l.consent ? 'No consent on record, so Asha will not call.' : '';
  const appt = (a) => `<div class="unit"><span>${a.type === 'visit' ? esc(a.project) : 'Callback'}</span><span class="small">${day(a.date)}, ${hhmm(a.time)} · ${esc(a.status === 'cancelled' ? 'called off' : a.status)}</span></div>`;
  const call = (c) => `<div class="call"><p class="small">${when(c.created_at)} · ${esc([resultOf(c), dur(c.duration)].filter(Boolean).join(' · '))}</p>
    ${c.summary ? `<p>${esc(c.summary)}</p>` : ''}${recordingHtml(c)}
    ${c.transcript ? `<details><summary>Transcript</summary>${transcriptHtml(c.transcript)}</details>` : ''}</div>`;
  openDlg(`<header><div><h2 class="title">${esc(l.name)}</h2><span class="small">${esc(l.phone)}</span></div>${closeBtn}</header>
    ${canCall ? `<button class="primary" data-call="${l.id}">Call</button>` : why ? `<p class="small">${why}</p>` : ''}
    <div class="section"><h3>Requirements</h3>${facts([['Looking for', need(l)], ['Purpose', l.purpose], ['Timeline', l.timeline], ['Project', l.interested_project], ['Next step', l.next_action], ['Enquiry', l.enquiry]]) || '<p class="small">Nothing yet.</p>'}</div>
    <div class="section"><h3>Status</h3><div class="correct">
      <label>Lead status<select id="leadStatus" data-id="${l.id}">${Object.entries(LABEL).map(([k, v]) => `<option value="${k}" ${k === l.status ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <button class="quiet dull" data-dnc="${l.id}" data-value="${l.do_not_call ? 0 : 1}">${l.do_not_call ? 'Allow calls again' : 'Mark do not call'}</button></div>
      ${decidedBy ? `<p class="small" style="margin-top:.375rem">${decidedBy}</p>` : ''}</div>
    ${l.appointments.length ? `<div class="section"><h3>Visits</h3>${l.appointments.map(appt).join('')}</div>` : ''}
    ${l.calls.length ? `<div class="section"><h3>Calls</h3>${l.calls.map(call).join('')}<p class="small" style="margin-top:.625rem">Summaries are written by AI.</p></div>` : ''}`);
}

function showCall(id) {
  const c = state.calls.find((x) => x.id === id);
  if (!c) return;
  openDlg(`<header><div><h2 class="title">${esc(c.lead ?? 'Unknown')}</h2><span class="small">${when(c.created_at)}</span></div>${closeBtn}</header>
    ${c.lead_id ? `<button class="secondary" data-lead="${c.lead_id}">Open lead</button>` : ''}
    ${c.summary ? `<div class="section"><h3>AI summary</h3><p>${esc(c.summary)}</p></div>` : ''}
    <div class="section"><h3>Call</h3>${facts([['Result', resultOf(c)], ['Lead status', LABEL[c.lead_status] ?? c.lead_status], ['Duration', dur(c.duration)], ['Campaign', c.campaign ?? 'Direct'], ['Project', c.project]])}${recordingHtml(c)}</div>
    <div class="section"><h3>Transcript</h3>${transcriptHtml(c.transcript)}</div>`);
}

function showProject(id) {
  const p = state.projects.find((x) => x.id === id);
  if (!p) return;
  openDlg(`<header><div><h2 class="title">${esc(p.name)}</h2><span class="small">${esc(p.location)}</span></div>${closeBtn}</header>
    ${p.description ? `<p>${esc(p.description)}</p>` : ''}
    <div class="section"><h3>Homes</h3>${p.configs.map((c) => `<div class="unit"><span>${c.bhk} BHK, ${c.size_sqft} sq ft</span><span class="small">from ${price(c.price_lakh)} · ${c.units_left} left</span></div>`).join('')}</div>
    <div class="section"><h3>Details</h3>${facts([['Possession', p.possession], ['Payment plan', p.payment_plan], ['Amenities', p.amenities.join(', ')], ['Nearby', p.landmarks.join(', ')]])}</div>`);
}

async function openCampaign() {
  const [leads, projects] = await Promise.all([get('/api/leads'), get('/api/projects')]);
  const ready = leads.filter((l) => !l.dial_blocker);
  state.names = new Map(ready.map((l) => [l.id, l.name]));
  const picked = ready.filter((l) => state.selected.has(l.id)).length;
  openDlg(`<header><h2 class="title">New campaign</h2>${closeBtn}</header>
    <label>Name<input id="cName" placeholder="Whitefield Heights launch" value="${esc(state.cName)}"></label>
    <label>Focus project<select id="cProject"><option value="">Whole portfolio</option>
      ${projects.map((p) => `<option value="${p.id}" ${String(p.id) === state.cProject ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
    ${ready.length ? `<div class="spread"><span class="small" id="pickCount">${picked} of ${ready.length} selected</span><button class="quiet" data-pickall>Select all</button></div>
      <div class="picks">${ready.map((l) => `<label class="check"><input type="checkbox" data-pick="${l.id}" ${state.selected.has(l.id) ? 'checked' : ''}>${esc(l.name)}</label>`).join('')}</div>`
      : '<p class="small" style="margin-bottom:1rem">Add a real lead with consent first. Sample leads are never called.</p>'}
    <button class="primary" data-launch ${meta.calling && picked ? '' : 'disabled'}>Start campaign</button>
    ${meta.calling ? '' : '<p class="small" style="margin-top:.5rem">Calling is off.</p>'}`);
}

function syncPicks() {
  const boxes = [...document.querySelectorAll('[data-pick]')];
  const n = boxes.filter((b) => b.checked).length;
  $('#pickCount').textContent = `${n} of ${boxes.length} selected`;
  $('[data-launch]').disabled = !meta.calling || !n;
}

const FORMS = {
  lead: `<header><h2 class="title">Add lead</h2>${closeBtn}</header>
    <form data-form="lead">
      <label>Name<input name="name" required autocomplete="off"></label>
      <label>Phone<input name="phone" type="tel" required placeholder="+91 98xxxxxxxx" inputmode="tel" autocomplete="off"></label>
      <label>Looking for<input name="enquiry" placeholder="3 BHK in Whitefield"></label>
      <label class="check"><input type="checkbox" name="consent" required>This person agreed to be contacted</label>
      <p style="margin-top:1rem"><button class="primary">Save lead</button></p>
    </form>`,
  csv: `<header><h2 class="title">Upload leads</h2>${closeBtn}</header>
    <p class="small" style="margin-bottom:1rem">Columns: name, phone, enquiry, source, consent. Set consent to yes only where you hold it. Anyone else is saved but not called.</p>
    <form data-form="csv">
      <label>CSV file<input type="file" name="file" accept=".csv,text/csv" required></label>
      <button class="primary">Upload leads</button>
    </form>`,
  project: `<header><h2 class="title">Add project</h2>${closeBtn}</header>
    <form data-form="project">
      <label>Name<input name="name" required></label>
      <label>Location<input name="location" required placeholder="Hebbal, Bengaluru"></label>
      <label>Areas buyers may mention<input name="areas" placeholder="hebbal, manyata"></label>
      <div class="split">
        <label>BHK<input name="bhk" type="number" min="1" max="9" required></label>
        <label>Size, sq ft<input name="size_sqft" type="number" min="1" required></label>
        <label>Starting price, lakh<input name="price_lakh" type="number" min="1" step="0.1" required></label>
        <label>Units left<input name="units_left" type="number" min="0" required></label>
      </div>
      <details><summary>More details</summary>
        <label style="margin-top:.75rem">Description<textarea name="description" rows="2"></textarea></label>
        <label>Amenities, comma separated<input name="amenities"></label>
        <label>Possession<input name="possession"></label>
        <label>Nearby landmarks, comma separated<input name="landmarks"></label>
        <label>Payment plan<input name="payment_plan"></label>
      </details>
      <p style="margin-top:1.25rem"><button class="primary">Save project</button></p>
    </form>`,
};

function launchSummary(ids, project) {
  const names = ids.map((id) => state.names.get(id)).filter(Boolean);
  const shown = names.slice(0, 3).join(', ');
  const others = names.length > 3 ? ` and ${plural(names.length - 3, 'other')}` : '';
  const start = meta.callingOpen ? 'straight away' : `at ${hhmm(meta.callsOpenAt)}, when calling hours open`;
  return `Asha starts calling ${shown}${others} ${start}${project ? `, leading with ${project}` : ''}. You can stop the campaign, but calls already ringing will finish.`;
}

document.addEventListener('click', act(async (e) => {
  const t = e.target.closest('button,tr[data-lead],tr[data-callrow],tr[data-project]');
  if (!t) return;
  const d = t.dataset;
  if (d.ask) return $('#ask').close(d.ask);
  if ('close' in d) return $('#dlg').close();
  if ('dismiss' in d) { t.parentElement.hidden = true; return; }
  if ('logout' in d) { await post('/logout'); location.replace('/login'); return; }
  if ('leadtab' in d) { state.leadFilter = d.leadtab; return safeRender(); }
  if ('calltab' in d) { state.callFilter = d.calltab; return safeRender(); }
  if ('visittab' in d) { state.visitFilter = d.visittab; return safeRender(); }
  if ('golead' in d) { state.leadFilter = d.golead; state.search = ''; location.hash = 'leads'; return; }
  if ('clear' in d) {
    const yes = await ask({ title: 'Clear sample data?', body: "This deletes the sample leads, calls and appointments. It can't be undone.", confirm: 'Clear data' });
    if (!yes) return;
    await post('/api/samples/clear');
    toast('Sample data cleared');
    return safeRender();
  }
  if (d.call) {
    const { held } = await once(t, () => post(`/api/leads/${d.call}/call`));
    toast(held ? `Calling hours are over, so Asha will call at ${hhmm(meta.callsOpenAt)}.` : 'Asha is calling now.');
    if ($('#dlg').open) $('#dlg').close();
    await pollLive().catch(noop);
    return safeRender();
  }
  if ('addlead' in d) return openDlg(FORMS.lead);
  if ('upload' in d) return openDlg(FORMS.csv);
  if ('addproject' in d) return openDlg(FORMS.project);
  if ('newcampaign' in d) return openCampaign();
  if (d.appt) {
    if (d.to === 'cancelled') {
      const noun = d.kind === 'visit' ? 'visit' : 'callback';
      const yes = await ask({ title: `Call off this ${noun}?`, body: "The buyer isn't told automatically, so let them know.", confirm: `Call off ${noun}` });
      if (!yes) return;
    }
    await once(t, () => post(`/api/appointments/${d.appt}`, { status: d.to }));
    return safeRender();
  }
  if ('pickall' in d) {
    document.querySelectorAll('[data-pick]').forEach((box) => { box.checked = true; state.selected.add(Number(box.dataset.pick)); });
    return syncPicks();
  }
  if ('launch' in d) {
    const lead_ids = [...state.selected].filter((id) => $(`[data-pick="${id}"]`));
    const project = state.cProject ? $('#cProject').selectedOptions[0]?.textContent : '';
    const yes = await ask({
      title: `Call ${lead_ids.length === 1 ? '1 person' : `${lead_ids.length} people`} now?`,
      body: launchSummary(lead_ids, project), confirm: 'Start calling',
    });
    if (!yes) return;
    await once(t, () => post('/api/campaigns', { name: state.cName, project_id: Number(state.cProject) || null, lead_ids }));
    state.selected.clear(); state.cName = ''; state.cProject = '';
    $('#dlg').close();
    toast('Campaign started');
    location.hash = 'campaigns';
    return;
  }
  if (d.stop) {
    const yes = await ask({ title: 'Stop this campaign?', body: 'No new calls will start, and queued calls are cancelled. Calls already ringing or connected will finish.', confirm: 'Stop campaign' });
    if (!yes) return;
    await once(t, () => post(`/api/campaigns/${d.stop}/stop`));
    toast('Campaign stopped');
    return safeRender();
  }
  if (d.dnc) {
    const on = d.value === '1';
    const yes = await ask(on
      ? { title: 'Mark as do not call?', body: "Asha won't call this person again, and their booked visits and callbacks are called off.", confirm: 'Mark do not call' }
      : { title: 'Allow calls again?', body: 'Only do this if this person asked to be contacted again.', confirm: 'Allow calls' });
    if (!yes) return;
    await post(`/api/leads/${d.dnc}`, { do_not_call: on });
    return showLead(d.dnc);
  }
  if (d.lead) return showLead(d.lead);
  if (d.callrow) return showCall(Number(d.callrow));
  if (d.project) return showProject(Number(d.project));
}));

document.addEventListener('change', act(async (e) => {
  const { id, dataset, value, checked } = e.target;
  if (dataset.pick) {
    const lead = Number(dataset.pick);
    if (checked) state.selected.add(lead); else state.selected.delete(lead);
    syncPicks();
  }
  if (id === 'cProject') state.cProject = value;
  if (id === 'leadStatus') {
    await post(`/api/leads/${dataset.id}`, { status: value });
    toast('Lead status updated');
    await showLead(dataset.id);
  }
}));
document.addEventListener('input', (e) => {
  if (e.target.id === 'search') { state.search = e.target.value; safeRender(); }
  if (e.target.id === 'cName') state.cName = e.target.value;
});

document.addEventListener('submit', act(async (e) => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  $('#dlgProblem').hidden = true;
  const f = Object.fromEntries(new FormData(form));
  await once(form.querySelector('button.primary'), async () => {
    if (form.dataset.form === 'lead') {
      await post('/api/leads', { ...f, consent: f.consent ? 'yes' : '', source: 'Manual' });
      toast('Lead added');
    }
    if (form.dataset.form === 'csv') {
      const r = await post('/api/leads/csv', await f.file.text(), true);
      if (!r.added && r.errors.length) throw new Error(`Nothing added. First problem: ${r.errors[0]}`);
      const notes = [r.errors.length && `${r.errors.length} skipped`, r.noConsent && `${r.noConsent} without consent will not be called`];
      toast(`Added ${r.added}. ${notes.filter(Boolean).join('. ')}`.trim(), 6000);
    }
    if (form.dataset.form === 'project') {
      const { bhk, size_sqft, price_lakh, units_left, ...rest } = f;
      await post('/api/projects', { ...rest, configs: [{ bhk, size_sqft, price_lakh, units_left }] });
      toast('Project saved. Asha can use it now.');
    }
  });
  $('#dlg').close();
}));

$('#dlg').addEventListener('close', () => { safeRender(); });
addEventListener('hashchange', () => {
  tab = tabFromHash();
  links();
  scrollTo(0, 0);
  const view = $('#view');
  view.classList.remove('enter');
  void view.offsetWidth;
  view.classList.add('enter');
  safeRender();
});
setInterval(poll, 4000);
links();
pollLive().catch(noop).finally(safeRender);
</script>
</body>
</html>
