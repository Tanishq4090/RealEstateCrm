<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="Of 2,241 US companies, 37 percent answered a web lead within an hour, 16 percent in 1 to 24 hours, 24 percent after 24 hours, and 23 percent never answered.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style>
<text x="30" y="38" font-size="24" font-weight="700" fill="#1f2328">How fast 2,241 companies answered a web lead</text>
<text x="30" y="66" font-size="16" fill="#57606a">Most leads wait. Almost a quarter are never answered at all.</text>
<rect x="30" y="92" width="285.6" height="72" rx="8" fill="#b23f08"/>
<text x="46" y="139" font-size="30" font-weight="700" fill="#fffaf5">37%</text>
<text x="32" y="190" font-size="15" fill="#57606a">Within 1 hour</text>
<rect x="318.6" y="92" width="121.8" height="72" rx="8" fill="#ee8a4e"/>
<text x="334.6" y="139" font-size="30" font-weight="700" fill="#241c16">16%</text>
<text x="320.6" y="190" font-size="15" fill="#57606a">1 to 24 hours</text>
<rect x="443.40000000000003" y="92" width="184.2" height="72" rx="8" fill="#f8d3b7"/>
<text x="459.40000000000003" y="139" font-size="30" font-weight="700" fill="#241c16">24%</text>
<text x="445.40000000000003" y="190" font-size="15" fill="#57606a">After 24 hours</text>
<rect x="630.6" y="92" width="179.4" height="72" rx="8" fill="#3f352d"/>
<text x="646.6" y="139" font-size="30" font-weight="700" fill="#fffaf5">23%</text>
<text x="632.6" y="190" font-size="15" fill="#57606a">Never</text>
<line x1="30" y1="214" x2="810" y2="214" stroke="#d0d7de"/>
<text x="30" y="246" font-size="17" fill="#1f2328">Reply within an hour and you are <tspan font-weight="700" fill="#b23f08">nearly 7 times</tspan> as likely to qualify the lead as an hour later.</text>
<text x="30" y="280" font-size="13" fill="#57606a">Oldroyd, McElheran and Elkington, Harvard Business Review, 2011, as summarised by SmartCompany. US data.</text>
</svg>
